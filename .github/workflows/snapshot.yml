name: Update snapshot from hithink

# 手动触发（手机/网页点 Run workflow）；需要每天自动跑时把 schedule 打开（20:30 CST = 12:30 UTC）
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch snapshot (hithink key from secret)
        env:
          HITHINK_KEY: ${{ secrets.HITHINK_KEY }}
        run: python snapshot/fetch_snapshot.py --html payoff.html --concurrency 4 --gap 0.25

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payoff.html
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新行情快照 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
