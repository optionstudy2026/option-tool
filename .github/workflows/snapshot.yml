name: Update snapshot from hithink

# 定时：每个交易日收盘后约 20:30 CST（=12:30 UTC）自动生成 snapshot.json；也可在 Actions 页手动触发
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch snapshot (hithink key from secret)
        env:
          HITHINK_KEY: ${{ secrets.HITHINK_KEY }}
        run: python snapshot/fetch_snapshot.py --html payoff.html --out snapshot.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新行情快照 $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
