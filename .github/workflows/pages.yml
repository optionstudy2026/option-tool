# Simple workflow for deploying static content to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  # Actions 用自带 GITHUB_TOKEN 提交的 commit 不会触发 push 型 workflow（GitHub 防递归），
  # 所以快照任务完成后要显式挂上 workflow_run，否则新快照永远不部署（2026-09-17 踩坑）。
  workflow_run:
    workflows: ["Update snapshot from hithink"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
