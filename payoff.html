// 图例排的希腊值刻度标注：Δ=0.5000（每格大小，希腊色，4位小数）
function gkScaleHtml(){
  const style = { delta:'#8b5cf6', gamma:'#ec4899', vega:'#06b6d4', theta:'#f59e0b' };
  const sym = { delta:'Δ', gamma:'Γ', vega:'V', theta:'Θ' };
  let html = '';
  ['delta','gamma','vega','theta'].forEach(k=>{
    const refPct = Math.round((gkRefIV[k]||0.10)*100);
    // 绝对值刻度
    if(k in gkScaleInfo){
      html += `<div class="legend-item" style="margin-left:12px;font-family:'SF Mono','Fira Code','Consolas',monospace;" title="刻度基准IV=${refPct}%（固定，不随滑块变）">
        <span style="color:${style[k]};font-weight:700;font-size:15px;">${sym[k]}=</span>
        <span style="color:${style[k]};font-size:15px;">${gkScaleInfo[k].toFixed(4)}</span>
        <span style="color:#94a3b8;font-size:12px;">(IV${refPct}%)</span>
      </div>`;
    }
    // 相对值刻度（资金效率口径，与竖线标注一致）
    if(k in gkScaleInfoRel){
      // delta=杠杆(倍，原值)；gamma/vega/theta ×100 转百分比
      const relVal = k==='delta' ? gkScaleInfoRel[k] : gkScaleInfoRel[k]*100;
      const relUnit = k==='delta' ? '倍' : (k==='gamma' ? '%/1%' : (k==='vega' ? '%/vol' : '%/天'));
      const relTip = k==='delta' ? '杠杆 λ=Δ·S/权利金' : (k==='gamma' ? '标的波动1%的gamma盈亏/权利金' : (k==='vega' ? 'IV每vol点变动/权利金' : '每日时间损耗/权利金'));
      html += `<div class="legend-item" style="margin-left:12px;font-family:'SF Mono','Fira Code','Consolas',monospace;" title="${relTip}；刻度基准IV=${refPct}%（固定）">
        <span style="color:${style[k]};font-weight:700;font-size:15px;">${sym[k]}/=</span>
        <span style="color:${style[k]};font-size:15px;">${relVal.toFixed(4)}${relUnit}</span>
        <span style="color:#94a3b8;font-size:12px;">(IV${refPct}%)</span>
      </div>`;
    }
  });
  if(html){
    html += `<div class="legend-item" style="margin-left:12px;color:#94a3b8;font-size:12px;">r=2%</div>`;
  }
  return html;
}

// ========== 热力图模式（三维因子空间截面 + 划线取曲线，2026-08-22） ==========
// 组合价值 V = f(S, DTE, IV) 是三维因子空间上的标量场。三张热力图各固定一个维度：
//   S×DTE 固定 IV（用左侧 IV 滑块/策略 IV 调）；S×IV 固定 DTE（用 DTE 滑块调）；
//   DTE×IV 固定 S（用工具条小滑块调）
// 在热力图上按住左键划线 → 沿线提取组合损益曲线（嵌入小图）：
//   横线 = 固定 DTE 的价格损益曲线（= 常规损益图）；竖线 = 固定 S 的时间衰减曲线；
//   斜线 = 情景路径（S、DTE 同时变，DTE×IV 图上斜线 = theta/vega 博弈路径）
let heatMode = null;        // null | 'sd' | 'si' | 'di'
let heatLine = null;        // 已确认的划线 {x1,y1,x2,y2}（当前模式两轴的数据坐标）
let heatDrag = null;        // 正在拖拽的划线（实时预览）
let heatFixS = null;        // DTE×IV 图的固定标的价格（null=用当前价）
let todayPt = null;         // 热力图"今天点"（可拖动标记，两轴数据坐标 {x,y}）
let heatDragToday = false;  // 正在拖动"今天点"
let heatGeom = null;        // 最近一次绘制的几何信息（供鼠标事件换算坐标）
let heatSliceData = null;   // 最近一次截面小图的信息 {L, vs, box, N, gx0, gx1}（供小图 hover 读数）
let heatSliceHover = -1;    // 截面小图上 hover 的采样点下标（-1=无）

const HEAT_DEFS = {
  sd: { x:'S',   y:'DTE', fix:'IV'  },
  si: { x:'S',   y:'IV',  fix:'DTE' },
  di: { x:'DTE', y:'IV',  fix:'S'   },
};
const HEAT_AXIS_LABEL = { S:'标的价格', DTE:'剩余天数', IV:'IV' };

function heatStrategy(){
  const a = getActiveStrategy();
  return (a && a.visible) ? a : strategies.find(x=>x.visible);
}
// 轴刻度格式化：IV→百分数，DTE→整数天，S→按量级
function fmtHeatAxis(axis, v){
  if(axis==='IV') return (v*100).toFixed(0)+'%';
  if(axis==='DTE') return v.toFixed(0);
  return v<10 ? v.toFixed(2) : (v<100 ? v.toFixed(1) : v.toFixed(0));
}
function fmtHeatVal(axis, v){
  if(axis==='IV') return (v*100).toFixed(1)+'%';
  if(axis==='DTE') return v.toFixed(1)+'天';
  return v<10 ? v.toFixed(3) : v.toFixed(1);
}

// "含微笑"开关状态（工具条勾选框，默认开）
function heatSmileOn(){
  const el = document.getElementById('heat-smile');
  return el ? el.checked : true;
}
// 组合理论价值（显式 IV 版）：与 calcPayoffForStrategy 同口径，但 IV 用传入值——
// calcPayoffForStrategy 内部走 getStrikeIV（忽略 iv 参数），热力图的 IV 轴用它不会生效。
// ivLevel 语义 = 微笑曲线的水平（≈ATM IV）；勾选"含微笑"时按偏度/曲率叠加每腿行权价的形状
function heatValueRaw(s, S, dte, ivLevel){
  const useSmile = heatSmileOn();
  if(dte>0.001){
    const T=dte/365, r=0.02; let total=0;
    for(const leg of s.legs){
      if(!leg.qty) continue;
      const sign=leg.direction==='buy'?1:-1;
      let iv = ivLevel;
      if(useSmile){
        iv = smileIV(ivLevel, smileParams.skew, smileParams.curvature, leg.strike/S - 1);
        if(!isFinite(iv) || iv < 0.005) iv = 0.005;
      }
      const bs=bsPrice(S,leg.strike,T,r,iv,leg.type==='call');
      total+=sign*bs.price*leg.qty*multiplier;
    }
    return total;   // 纯理论价值（不含成本；成本在 heatCellValue 减）
  }
  let total=0;
  for(const leg of s.legs){
    if(!leg.qty) continue;
    const sign=leg.direction==='buy'?1:-1;
    const intr=leg.type==='call'?Math.max(0,S-leg.strike):Math.max(0,leg.strike-S);
    total+=sign*intr*leg.qty*multiplier;
  }
  return total;
}
// 热力图参数装配：轴范围 + 固定维取值 + 建仓成本基准
// mode 默认取当前 heatMode；截面大图模式传 sliceView.hm
function heatSetup(mode){
  mode = mode || heatMode;
  const s = heatStrategy();
  if(!s || !underlyingPrice || !originalDTE || !mode) return null;
  const def = HEAT_DEFS[mode];
  const baseIV = getStrategyIV(s);   // 策略 IV（含全局 ivOffset）
  let sMin = parseFloat(document.getElementById('xrange-min').value);
  let sMax = parseFloat(document.getElementById('xrange-max').value);
  if(!isFinite(sMin)||!isFinite(sMax)||sMin>=sMax){ sMin=underlyingPrice*0.85; sMax=underlyingPrice*1.15; }
  const axes = {
    S:   { min:sMin, max:sMax },
    DTE: { min:0, max:originalDTE },
    IV:  { min:Math.max(0.01, baseIV-0.15), max:baseIV+0.15 },
  };
  const fixVal = def.fix==='IV' ? baseIV : (def.fix==='DTE' ? sliderDTE : (heatFixS||underlyingPrice));
  // 建仓成本基准：今天（当前价、合约真实剩余天数、策略 IV 水平）的组合理论价值
  // 用同一个求值器（含相同的微笑开关状态），保证"今天"那一格损益≈0
  const entry = heatValueRaw(s, underlyingPrice, originalDTE, baseIV);
  return { s, def, axes, fixVal, entry };
}
// 单格求值：两轴数据坐标 → (S,DTE,IV) → 组合损益（相对建仓成本）
function heatCellValue(st, xa, ya, dim){
  const v = { S:st.fixVal, DTE:st.fixVal, IV:st.fixVal };
  v[st.def.x] = xa; v[st.def.y] = ya;
  const S=v.S, DTE=Math.max(v.DTE,0), IV=Math.max(v.IV,0.005);
  // 热力图/截面显示维度参数：dim 显式传入（截面叠加用），默认损益
  const d = dim || 'pnl';
  if(d && d!=='pnl'){
    return heatGreeksRaw(st.s, S, DTE, IV, d);
  }
  // 盈亏口径：点理论价值 - 建仓成本（成本变化 → 热力图/截面平衡点移动）
  return heatValueRaw(st.s, S, DTE, IV) - (st.s.cost||0);
}
// 单腿 BS 希腊值（用于热力图/截面的希腊值维度）
function bsGreek(S, K, T, r, iv, isCall, key){
  if(T<=0) T=0.001;
  const d1=(Math.log(S/K)+(r+iv*iv/2)*T)/(iv*Math.sqrt(T));
  const d2=d1-iv*Math.sqrt(T);
  if(key==='delta') return isCall?cdfNorm(d1):cdfNorm(d1)-1;
  if(key==='gamma') return pdfNorm(d1)/(S*iv*Math.sqrt(T));
  if(key==='vega')  return S*Math.sqrt(T)*pdfNorm(d1)/100;
  if(key==='theta'){
    const t1=-(S*pdfNorm(d1)*iv)/(2*Math.sqrt(T));
    // 每天口径（与主图 theoGreek 一致：/365）
    return isCall
      ? (t1 - r*K*Math.exp(-r*T)*cdfNorm(d2))/365
      : (t1 + r*K*Math.exp(-r*T)*cdfNorm(-d2))/365;
  }
  return null;
}
// 组合希腊值（各腿 BS 希腊 × 方向 × 手数 × 乘数）
function heatGreeksRaw(s, S, dte, ivLevel, key){
  if(dte<=0.001) return 0;
  const T=dte/365, r=0.02;
  let total=0;
  for(const leg of s.legs){
    if(!leg.qty) continue;
    const sign=leg.direction==='buy'?1:-1;
    let iv=ivLevel;
    if(heatSmileOn()){
      iv = smileIV(ivLevel, smileParams.skew, smileParams.curvature, leg.strike/S - 1);
      if(!isFinite(iv) || iv<0.005) iv=0.005;
    }
    const g = bsGreek(S, leg.strike, T, r, iv, leg.type==='call', key);
    if(g==null || !isFinite(g)) continue;
    total += sign * g * leg.qty * multiplier;
  }
  return total;
}
// 截面标题：近横线/近竖线/斜线三种语义
function heatSliceTitle(L, st){
  const XA = st.axes[st.def.x], YA = st.axes[st.def.y];
  const dxN = Math.abs(L.x2-L.x1)/(XA.max-XA.min), dyN = Math.abs(L.y2-L.y1)/(YA.max-YA.min);
  if(dyN < 0.02) return `固定${HEAT_AXIS_LABEL[st.def.y]}=${fmtHeatVal(st.def.y,(L.y1+L.y2)/2)} → 损益 vs ${HEAT_AXIS_LABEL[st.def.x]}`;
  if(dxN < 0.02) return `固定${HEAT_AXIS_LABEL[st.def.x]}=${fmtHeatVal(st.def.x,(L.x1+L.x2)/2)} → 损益 vs ${HEAT_AXIS_LABEL[st.def.y]}`;
  return `情景路径：损益 vs 路径进度 t（0=起点 → 1=终点，横轴两端标注两轴坐标）`;
}

function drawHeatmap(canvas, ctx, w, h){
  const st = heatSetup();
  if(!st){
    ctx.fillStyle='#94a3b8'; ctx.font='18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('热力图需要先加载行情', w/2, h/2);
    return;
  }
  const margin = { top:50, right:80, bottom:44, left:70 };
  const pw = w-margin.left-margin.right, ph = h-margin.top-margin.bottom;
  if(pw<=40||ph<=40) return;
  const XA = st.axes[st.def.x], YA = st.axes[st.def.y];
  const toPx = x => margin.left + (x-XA.min)/(XA.max-XA.min)*pw;
  const toPy = y => margin.top + ph - (y-YA.min)/(YA.max-YA.min)*ph;
  heatGeom = { margin, pw, ph, XA, YA,
    fromPx: px => XA.min + (px-margin.left)/pw*(XA.max-XA.min),
    fromPy: py => YA.min + (margin.top+ph-py)/ph*(YA.max-YA.min) };

  // 今天点初始化：默认=当前状态（S=当前价、DTE=sliderDTE、IV=策略IV），可拖动
  if(!todayPt){
    const s0 = { S: underlyingPrice, DTE: sliderDTE, IV: getStrategyIV(st.s) };
    todayPt = { x: s0[st.def.x], y: s0[st.def.y] };
    // clamp 到轴范围
    todayPt.x = Math.max(XA.min, Math.min(XA.max, todayPt.x));
    todayPt.y = Math.max(YA.min, Math.min(YA.max, todayPt.y));
  }

  // 采样网格（红盈绿亏，透明度随 |损益| 加深；对称归一）
  const nx = 140, ny = 70;
  const vals = new Float64Array(nx*ny);
  let maxAbs = 1e-9;
  for(let j=0;j<ny;j++){
    const ya = YA.min + (YA.max-YA.min)*(j+0.5)/ny;
    for(let i=0;i<nx;i++){
      const xa = XA.min + (XA.max-XA.min)*(i+0.5)/nx;
      const v = heatCellValue(st, xa, ya);
      vals[j*nx+i] = v;
      if(Math.abs(v)>maxAbs) maxAbs=Math.abs(v);
    }
  }
  const cw = pw/nx, ch = ph/ny;
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const t = vals[j*nx+i]/maxAbs;
    ctx.fillStyle = t>=0
      ? `rgba(220,53,69,${(0.07+0.75*Math.min(1,t)).toFixed(3)})`
      : `rgba(34,160,90,${(0.07+0.75*Math.min(1,-t)).toFixed(3)})`;
    // j=0 是 yMin（底部），往上画
    ctx.fillRect(margin.left+i*cw, margin.top+ph-(j+1)*ch, cw+0.5, ch+0.5);
  }

  // 轴框 + 刻度
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1;
  ctx.strokeRect(margin.left, margin.top, pw, ph);
  ctx.fillStyle='#64748b'; ctx.font='13px sans-serif';
  ctx.textAlign='center';
  for(let i=0;i<=6;i++){ const xv=XA.min+(XA.max-XA.min)*i/6; ctx.fillText(fmtHeatAxis(st.def.x,xv), toPx(xv), margin.top+ph+18); }
  ctx.textAlign='right';
  for(let i=0;i<=5;i++){ const yv=YA.min+(YA.max-YA.min)*i/5; ctx.fillText(fmtHeatAxis(st.def.y,yv), margin.left-6, toPy(yv)+4); }
  ctx.textAlign='center';
  ctx.fillText(HEAT_AXIS_LABEL[st.def.x], margin.left+pw/2, margin.top+ph+36);
  ctx.save(); ctx.translate(16, margin.top+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(HEAT_AXIS_LABEL[st.def.y], 0, 0); ctx.restore();

  // 标题：策略名 + 固定维取值（并提示用哪个滑块调；IV 轴注明微笑状态）
  const fixHint = st.def.fix==='IV' ? '左侧IV滑块' : (st.def.fix==='DTE' ? '左侧DTE滑块' : '工具条固定S滑块');
  const smileNote = (st.def.x==='IV'||st.def.y==='IV'||st.def.fix==='IV')
    ? (heatSmileOn() ? ' · IV=微笑水平(ATM)，含偏度/曲率' : ' · 平IV(不含微笑)') : '';
  ctx.fillStyle='#1e293b'; ctx.font='bold 15px sans-serif'; ctx.textAlign='left';
  // 标题起点右移，避开左上角浮动的 X轴 输入条
  ctx.fillText(`${st.s.name} 损益热力图（红盈绿亏） · 固定${HEAT_AXIS_LABEL[st.def.fix]}=${fmtHeatVal(st.def.fix,st.fixVal)}（用${fixHint}调）${smileNote} · 最大|损益|刻度 ${fmtSig(maxAbs)}元`, margin.left+Math.min(250,w*0.3), margin.top-26);

  // "今天"的位置标记（当前价、真实DTE、当前IV 映射到本图两轴）
  const today = { S:underlyingPrice, DTE:originalDTE, IV:getStrategyIV(st.s) };
  const tx = today[st.def.x], ty = today[st.def.y];
  if(tx>=XA.min&&tx<=XA.max&&ty>=YA.min&&ty<=YA.max){
    ctx.fillStyle='#f97316'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(toPx(tx), toPy(ty), 5, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f97316'; ctx.font='bold 13px sans-serif'; ctx.textAlign='left';
    ctx.fillText('今天', toPx(tx)+9, toPy(ty)+4);
  }

  // 划线（拖拽预览优先，否则用已确认的线）+ 截面曲线小图
  const L = heatDrag || heatLine;
  if(L){
    ctx.strokeStyle='#f97316'; ctx.lineWidth=2.5; ctx.setLineDash([7,4]);
    ctx.beginPath(); ctx.moveTo(toPx(L.x1), toPy(L.y1)); ctx.lineTo(toPx(L.x2), toPy(L.y2)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#f97316';
    [[L.x1,L.y1],[L.x2,L.y2]].forEach(([a,b])=>{ ctx.beginPath(); ctx.arc(toPx(a),toPy(b),4,0,6.283); ctx.fill(); });

    // 沿线采样 100 点
    const N=100, vs=new Float64Array(N+1);
    for(let i=0;i<=N;i++){
      const t=i/N;
      vs[i] = heatCellValue(st, L.x1+(L.x2-L.x1)*t, L.y1+(L.y2-L.y1)*t);
    }
    // 嵌入小图：左下角，半透明白底
    const iw = Math.min(pw*0.46, 430), ih = ph*0.38;
    const ix = margin.left+12, iy = margin.top+ph-ih-12;
    ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.fillRect(ix,iy,iw,ih);
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1; ctx.strokeRect(ix,iy,iw,ih);
    let vmin=Infinity, vmax=-Infinity;
    for(const v of vs){ if(v<vmin)vmin=v; if(v>vmax)vmax=v; }
    if(vmin===vmax){ vmin-=1; vmax+=1; }
    const vpad=(vmax-vmin)*0.12; vmin-=vpad; vmax+=vpad;
    // 左侧极值标注宽度自适应：窗口窄时缩小留白，保证曲线区不被挤没
    const padL = Math.min(46, Math.max(24, iw*0.12));
    const gx = t => ix+padL+t*(iw-padL-10);
    const gy = v => iy+24+(vmax-v)/(vmax-vmin)*(ih-40);
    if(vmin<0&&vmax>0){
      ctx.strokeStyle='#cbd5e1'; ctx.beginPath(); ctx.moveTo(gx(0),gy(0)); ctx.lineTo(gx(1),gy(0)); ctx.stroke();
    }
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<=N;i++){ const px=gx(i/N), py=gy(vs[i]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke();
    // hover 读数标记（onHeatMouseMove 里命中截面小图时设置）
    if(heatSliceHover>=0 && heatSliceHover<=N){
      ctx.fillStyle='#f97316'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(gx(heatSliceHover/N), gy(vs[heatSliceHover]), 4.5, 0, 6.283); ctx.fill(); ctx.stroke();
    }
    // 存截面信息供 hover 反查
    heatSliceData = { L:{...L}, vs, N, box:{x:ix,y:iy,w:iw,h:ih}, gx0:gx(0), gx1:gx(1) };
    // 标注：标题 + 纵轴极值 + 起终值 + 横轴端点（横/竖线时显示变化轴的数据值）
    ctx.fillStyle='#1e293b'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
    ctx.fillText(heatSliceTitle(L, st), ix+8, iy+15);
    ctx.font='11px sans-serif'; ctx.fillStyle='#64748b'; ctx.textAlign='right';
    ctx.fillText(fmtSig(vmax), ix+padL-4, iy+30);
    ctx.fillText(fmtSig(vmin), ix+padL-4, iy+ih-6);
    ctx.fillStyle='#2563eb'; ctx.textAlign='left';
    ctx.fillText(`起 ${fmtSig(vs[0])}`, gx(0), iy+ih-6);
    ctx.textAlign='right';
    ctx.fillText(`终 ${fmtSig(vs[N])}`, gx(1), iy+ih-6);
    const XAr = st.axes[st.def.x], YAr = st.axes[st.def.y];
    const dxN = Math.abs(L.x2-L.x1)/(XAr.max-XAr.min), dyN = Math.abs(L.y2-L.y1)/(YAr.max-YAr.min);
    ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif';
    if(dyN<0.02 || dxN<0.02){
      const axis = dyN<0.02 ? st.def.x : st.def.y;
      const a1 = dyN<0.02 ? L.x1 : L.y1, a2 = dyN<0.02 ? L.x2 : L.y2;
      ctx.textAlign='left';  ctx.fillText(fmtHeatVal(axis,a1), gx(0), iy+ih+11);
      ctx.textAlign='right'; ctx.fillText(fmtHeatVal(axis,a2), gx(1), iy+ih+11);
    } else {
      // 斜线：横轴两端同时标注两个轴的坐标（t 无物理单位，坐标才有意义）
      ctx.textAlign='left';  ctx.fillText(`${fmtHeatVal(st.def.x,L.x1)} · ${fmtHeatVal(st.def.y,L.y1)}`, gx(0), iy+ih+11);
      ctx.textAlign='right'; ctx.fillText(`${fmtHeatVal(st.def.x,L.x2)} · ${fmtHeatVal(st.def.y,L.y2)}`, gx(1), iy+ih+11);
    }
  } else {
    heatSliceData = null; heatSliceHover = -1;
  }

  // 今天点（可拖动标记）：白圈+黑心+损益标签
  if(todayPt && !sliceView){
    const tpx = margin.left + (todayPt.x-XA.min)/(XA.max-XA.min)*pw;
    const tpy = margin.top + ph - (todayPt.y-YA.min)/(YA.max-YA.min)*ph;
    if(tpx>=margin.left-8 && tpx<=margin.left+pw+8 && tpy>=margin.top-8 && tpy<=margin.top+ph+8){
      // 外圈（白色描边，抗色块干扰）
      ctx.beginPath(); ctx.arc(tpx, tpy, 8, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fill();
      ctx.strokeStyle='#0f172a'; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(tpx, tpy, 3.2, 0, Math.PI*2); ctx.fillStyle='#0f172a'; ctx.fill();
      // 损益标签
      const tv = heatCellValue(st, todayPt.x, todayPt.y);
      ctx.font='bold 13px sans-serif'; ctx.textAlign='left';
      ctx.fillStyle = tv>=0 ? '#dc2626' : '#16a34a';
      ctx.fillText(`${tv>=0?'+':''}${fmtSig(tv)}元`, tpx+12, tpy-12);
      ctx.font='11px sans-serif'; ctx.fillStyle='#475569';
      ctx.fillText(`拖动调今天点`, tpx+12, tpy+2);
    }
  }
}

// 热力图鼠标事件：左键按下开始划线，拖动实时预览截面，松开确认；单击（未拖动）或右键清除
function heatEventPos(e, canvas){
  const rect=canvas.getBoundingClientRect();
  return { px:e.clientX-rect.left, py:e.clientY-rect.top };
}
function heatClampToPlot(g, px, py){
  return {
    x: g.XA.min + Math.max(0,Math.min(1,(px-g.margin.left)/g.pw))*(g.XA.max-g.XA.min),
    y: g.YA.min + Math.max(0,Math.min(1,(g.margin.top+g.ph-py)/g.ph))*(g.YA.max-g.YA.min),
  };
}
function onHeatMouseDown(e, canvas){
  if(e.button!==0 || !heatGeom) return;
  const {px,py} = heatEventPos(e,canvas);
  const g = heatGeom;
  if(px<g.margin.left||px>g.margin.left+g.pw||py<g.margin.top||py>g.margin.top+g.ph) return;
  // 截面小图区域内按下不启动划线（否则单击小图会先清掉已确认的线，双击放大永远到不了）
  if(heatSliceData){
    const b = heatSliceData.box;
    if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h) return;
  }
  const p = heatClampToPlot(g,px,py);
  // 今天点拖动：按下位置靠近 todayPt（像素距离<14px）→ 进入拖动，不启动划线
  if(todayPt && !sliceView){
    const tpx = g.margin.left + (todayPt.x-g.XA.min)/(g.XA.max-g.XA.min)*g.pw;
    const tpy = g.margin.top + g.ph - (todayPt.y-g.YA.min)/(g.YA.max-g.YA.min)*g.ph;
    if(Math.hypot(px-tpx, py-tpy) <= 14){
      heatDragToday = true;
      heatDrag = null; heatLine = null;
      return;
    }
  }
  heatDrag = { x1:p.x, y1:p.y, x2:p.x, y2:p.y };
  heatLine = null;
}
function onHeatMouseMove(e, canvas, tooltip){
  const {px,py} = heatEventPos(e,canvas);
  const g = heatGeom;
  if(!g) return;
  if(heatDragToday){
    const p = heatClampToPlot(g,px,py);
    todayPt.x = p.x; todayPt.y = p.y;
    tooltip.style.display='none';
    drawChart();
    return;
  }
  if(heatDrag){
    const p = heatClampToPlot(g,px,py);
    heatDrag.x2=p.x; heatDrag.y2=p.y;
    tooltip.style.display='none';
    drawChart();
    return;
  }
  // 截面小图 hover：读截线上任一点的完整坐标（斜线时 t 无物理单位，双坐标才有意义）
  if(heatSliceData){
    const b = heatSliceData.box;
    if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h){
      const st = heatSetup(); if(!st) return;
      const t = Math.max(0, Math.min(1, (px-heatSliceData.gx0)/(heatSliceData.gx1-heatSliceData.gx0)));
      const idx = Math.round(t*heatSliceData.N);
      const L = heatSliceData.L;
      const xa = L.x1+(L.x2-L.x1)*t, ya = L.y1+(L.y2-L.y1)*t;
      const v = heatSliceData.vs[idx];
      tooltip.style.display='block';
      tooltip.style.left=(px+12)+'px';
      tooltip.style.top=(py-46)+'px';
      tooltip.innerHTML=`t=${(idx/heatSliceData.N).toFixed(2)} · ${HEAT_AXIS_LABEL[st.def.x]}: <strong>${fmtHeatVal(st.def.x,xa)}</strong> · ${HEAT_AXIS_LABEL[st.def.y]}: <strong>${fmtHeatVal(st.def.y,ya)}</strong><br>损益: <strong style="color:${v>=0?'#dc2626':'#16a34a'}">${v>=0?'+':''}${fmtSig(v)}元</strong>`;
      if(heatSliceHover!==idx){ heatSliceHover=idx; drawChart(); }
      return;
    }
    if(heatSliceHover>=0){ heatSliceHover=-1; drawChart(); }
  }
  // hover：显示该格（S,DTE/IV,损益）
  const st = heatSetup();
  if(!st || px<g.margin.left||px>g.margin.left+g.pw||py<g.margin.top||py>g.margin.top+g.ph){
    tooltip.style.display='none'; return;
  }
  const p = heatClampToPlot(g,px,py);
  const v = heatCellValue(st, p.x, p.y);
  tooltip.style.display='block';
  tooltip.style.left=(px+12)+'px';
  tooltip.style.top=(py-40)+'px';
  tooltip.innerHTML=`${HEAT_AXIS_LABEL[st.def.x]}: <strong>${fmtHeatVal(st.def.x,p.x)}</strong> · ${HEAT_AXIS_LABEL[st.def.y]}: <strong>${fmtHeatVal(st.def.y,p.y)}</strong><br>组合损益: <strong style="color:${v>=0?'#dc2626':'#16a34a'}">${v>=0?'+':''}${fmtSig(v)}元</strong>`;
}
function onHeatMouseUp(e, canvas){
  if(e.button!==0) return;
  if(heatDragToday){ heatDragToday = false; return; }
  if(!heatDrag) return;
  const {px,py} = heatEventPos(e,canvas);
  const g = heatGeom;
  // 拖拽距离（像素）够长才确认划线，否则视为单击清除
  const x1px = g.margin.left + (heatDrag.x1-g.XA.min)/(g.XA.max-g.XA.min)*g.pw;
  const y1px = g.margin.top + g.ph - (heatDrag.y1-g.YA.min)/(g.YA.max-g.YA.min)*g.ph;
  const dist = Math.hypot(px-x1px, py-y1px);
  if(dist>10) heatLine = {...heatDrag};
  heatDrag = null;
  drawChart();
}

// ========== 截面大图（双击热力图截面小图进入，2026-08-22） ==========
// 通用截面曲线视图：不再是"只有标的价格"的曲线，而是热力图上任意直线的截面。
// 坐标方案（用户定）：横/竖线 → 横轴=变化轴单值；斜线 → 标题写 (参数Y, 参数X, 斜率)，
// 刻度用成对数值 (y值, x值)，如 (5%, 2.0)、(10%, 2.2)
let sliceView = null;    // { L:{x1,y1,x2,y2}, hm:'sd'|'si'|'di' }
let sliceHoverT = null;  // hover 的 t∈[0,1]（绝对值，null=无）
let sliceGeom = null;    // 最近一次绘制的几何信息
let slicePins = [];      // 固定竖线（绝对 t 值），点击建/拖动移/右键删
let sliceZoom = null;    // {t0,t1} X 方向（路径方向）缩放子区间，左键拖框设置，F 键复位
let slicePinDrag = -1;   // 正在拖动的竖线下标
let sliceDownStart = null; // 左键按下点 {px,py,t}
let sliceZoomFrom = null;  // 缩放框起点（像素）
let sliceZoomCur = null;

// ========== 剖面线斜率控制（2026-09-12 用户要求：截出曲线后能用滑块改斜率） ==========
// 滑块 -100~+100 映射归一化角度 -90°~+90°（0 = 水平/沿横轴，±100 = 竖直/沿纵轴）
// "归一化"= 以各自坐标轴跨度为单位度量，这样 S×DTE 这种量纲差异极大的图也能直觉旋转
function sliceAxisSpans(){
  if(!sliceView) return null;
  const st = heatSetup(sliceView.hm); if(!st) return null;
  const XA = st.axes[st.def.x], YA = st.axes[st.def.y];
  const sx = XA.max-XA.min, sy = YA.max-YA.min;
  if(!(sx>0) || !(sy>0)) return null;
  return { XA, YA, sx, sy, st };
}
function sliceAngleDeg(){
  const sp = sliceAxisSpans(); if(!sp) return 0;
  const L = sliceView.L;
  const hx = (L.x2-L.x1)/sp.sx, hy = (L.y2-L.y1)/sp.sy;
  if(hx===0 && hy===0) return 0;
  let deg = Math.atan2(hy, hx)*180/Math.PI;
  while(deg > 90) deg -= 180;
  while(deg < -90) deg += 180;
  return deg;
}
function sliceSlopeText(){
  const sp = sliceAxisSpans(); if(!sp) return '';
  const L = sliceView.L, st = sp.st;
  const nX = Math.abs(L.x2-L.x1)/sp.sx, nY = Math.abs(L.y2-L.y1)/sp.sy;
  const deg = sliceAngleDeg();
  if(nY < 0.02) return `水平 (${deg.toFixed(0)}°)`;
  if(nX < 0.02) return `竖直 (${deg.toFixed(0)}°)`;
  const slope = (L.y2-L.y1)/(L.x2-L.x1);
  const sVal = st.def.y==='IV' ? (slope*100).toFixed(2)+'%' : slope.toFixed(3);
  return `${slope>=0?'+':''}${sVal}/${axisUnit(st.def.x)||'单位'} (${deg.toFixed(0)}°)`;
}
// 旋转剖面线：中点固定；线段在归一化坐标下的半长保持不变（必要时整体缩短以留在热力图范围内，角度不扭曲）
function setSliceSlope(v){
  const sp = sliceAxisSpans(); if(!sp) return;
  const deg = Math.max(-90, Math.min(90, Number(v)*0.9));
  const L = sliceView.L;
  const mx = (L.x1+L.x2)/2, my = (L.y1+L.y2)/2;
  const h = Math.hypot((L.x2-L.x1)/(2*sp.sx), (L.y2-L.y1)/(2*sp.sy));
  if(!(h>0)) return;
  const rad = deg*Math.PI/180;
  // 方向向量：cos 在 |deg|<90 时恒正，sin 带符号 → 负滑块 = 负斜率（价格涨、纵轴量下降）
  const cx = Math.abs(deg) >= 89.999 ? 0 : Math.cos(rad);
  const cy = Math.abs(deg) < 1e-9 ? 0 : Math.sin(rad);
  // 单个缩放系数 k 让两端都留在轴范围内（同时缩 x/y，保持角度不歪）
  let k = 1;
  if(cx > 0){ const avail = Math.min(mx-sp.XA.min, sp.XA.max-mx); k = Math.min(k, avail/(h*cx*sp.sx)); }
  if(Math.abs(cy) > 0){ const avail = Math.min(my-sp.YA.min, sp.YA.max-my); k = Math.min(k, avail/(h*Math.abs(cy)*sp.sy)); }
  k = Math.max(0.35, Math.min(1, k));
  const nLX = h*cx*sp.sx*k, nLY = h*cy*sp.sy*k;
  L.x1 = mx-nLX; L.x2 = mx+nLX; L.y1 = my-nLY; L.y2 = my+nLY;
  sliceHoverT = null;
  clearSliceSlopeUI();   // 注意：syncHeatToolbar 是 init() 内部函数，这里不能调（会 ReferenceError）
  drawChart();
}
function clearSliceSlopeUI(){
  const w = document.getElementById('slice-slope-wrap');
  if(w) w.style.display = sliceView ? 'inline-flex' : 'none';
  if(sliceView){
    const sl = document.getElementById('slice-slope');
    if(sl) sl.value = Math.round(sliceAngleDeg()/0.9);
    const el = document.getElementById('slice-slope-val');
    if(el) el.textContent = sliceSlopeText();
  }
}

function axisUnit(axis){ return axis==='S' ? '元' : (axis==='DTE' ? '天' : ''); }
function sliceTRange(){ return sliceZoom ? {t0:sliceZoom.t0, t1:sliceZoom.t1} : {t0:0, t1:1}; }

function drawSliceChart(canvas, ctx, w, h){
  sliceGeom = null;
  const st = heatSetup(sliceView.hm);
  if(!st){
    ctx.fillStyle='#94a3b8'; ctx.font='18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('截面视图需要先加载行情', w/2, h/2);
    return;
  }
  const L = sliceView.L;
  const {t0, t1} = sliceTRange();
  const N = 300;
  const vs = new Float64Array(N+1);
  let vmin=Infinity, vmax=-Infinity;
  for(let i=0;i<=N;i++){
    const t=t0+(t1-t0)*i/N;
    const v = heatCellValue(st, L.x1+(L.x2-L.x1)*t, L.y1+(L.y2-L.y1)*t);
    vs[i]=v; if(v<vmin)vmin=v; if(v>vmax)vmax=v;
  }
  if(vmin===vmax){ vmin-=1; vmax+=1; }
  const vpad=(vmax-vmin)*0.15; vmin-=vpad; vmax+=vpad;
  // Y 轴强制包含 0（盈亏视角）：否则成本变化时曲线与刻度同步平移，视觉上"不变"
  if(vmin > 0) vmin = 0;
  if(vmax < 0) vmax = 0;
  const margin={top:56, right:30, bottom:70, left:80};
  const pw=w-margin.left-margin.right, ph=h-margin.top-margin.bottom;
  if(pw<=60||ph<=60) return;
  const gx=t=>margin.left+(t-t0)/(t1-t0)*pw, gy=v=>margin.top+(vmax-v)/(vmax-vmin)*ph;
  sliceGeom={margin, pw, ph, N, t0, t1};

  // 网格 + Y 轴刻度（取整：1/2/5 系列，避免零头刻度）
  ctx.strokeStyle='rgba(203,213,225,0.6)'; ctx.lineWidth=0.6;
  ctx.fillStyle='#64748b'; ctx.font='14px sans-serif'; ctx.textAlign='right';
  niceTicks(vmin, vmax, 5).forEach(v=>{
    const y=gy(v);
    ctx.beginPath(); ctx.moveTo(margin.left,y); ctx.lineTo(margin.left+pw,y); ctx.stroke();
    ctx.fillText(fmtSig(v), margin.left-8, y+5);
  });
  // 零线加粗
  if(vmin<0&&vmax>0){
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(margin.left,gy(0)); ctx.lineTo(margin.left+pw,gy(0)); ctx.stroke();
  }
  // 轴框
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1;
  ctx.strokeRect(margin.left, margin.top, pw, ph);

  // 盈亏填充（跟随策略"填"开关，红盈绿亏；与主图曲线模式同一视觉语言）
  if(st.s.fill){
    ctx.save();
    ctx.beginPath(); ctx.rect(margin.left,margin.top,pw,ph); ctx.clip();
    const zeroY = gy(0);
    for(let j=0;j<N;j++){
      const y1=vs[j], y2=vs[j+1];
      const x1=margin.left+pw*j/N, x2=margin.left+pw*(j+1)/N;
      const sy1=gy(y1), sy2=gy(y2);
      if(y1>=0 && y2>=0){
        ctx.fillStyle='rgba(239,68,68,0.18)';
        ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill();
      } else if(y1<=0 && y2<=0){
        ctx.fillStyle='rgba(34,197,94,0.18)';
        ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill();
      } else {
        const tt = y1/(y1-y2);
        const xi = x1+(x2-x1)*tt;
        const c1 = y1>0 ? 'rgba(239,68,68,0.18)' : 'rgba(34,197,94,0.18)';
        const c2 = y1>0 ? 'rgba(34,197,94,0.18)' : 'rgba(239,68,68,0.18)';
        ctx.fillStyle=c1; ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(xi,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill();
        ctx.fillStyle=c2; ctx.beginPath(); ctx.moveTo(xi,zeroY); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  // 截面语义判定
  const XA=st.axes[st.def.x], YA=st.axes[st.def.y];
  const dxN=Math.abs(L.x2-L.x1)/(XA.max-XA.min), dyN=Math.abs(L.y2-L.y1)/(YA.max-YA.min);
  const isH=dyN<0.02, isV=dxN<0.02;

  // X 轴刻度：取整（1/2/5 系列）+ 竖直网格线（标签位置一目了然）
  // 取整依据"主轴"：横线/斜线 → X 轴参数；竖线 → Y 轴参数（竖线时 X 参数不变，只能按 Y 取整）
  // 斜线标签为成对数值 (y值, x值)，其中主轴值是整数刻度
  const pri1 = isV ? L.y1 : L.x1, pri2 = isV ? L.y2 : L.x2;
  const paA = pri1+(pri2-pri1)*t0, paB = pri1+(pri2-pri1)*t1;   // 可见子区间的主轴起终值
  const priTicks = niceTicks(Math.min(paA,paB), Math.max(paA,paB), (isH||isV)?5:3);
  ctx.font='12px sans-serif'; ctx.textAlign='center';
  priTicks.forEach(av=>{
    const t = (paB===paA) ? (t0+t1)/2 : t0 + (av-paA)/(paB-paA)*(t1-t0);
    if(t<t0-1e-9||t>t1+1e-9) return;
    const xp = gx(t);
    ctx.strokeStyle='rgba(203,213,225,0.6)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(xp, margin.top); ctx.lineTo(xp, margin.top+ph); ctx.stroke();
    const xv=L.x1+(L.x2-L.x1)*t, yv=L.y1+(L.y2-L.y1)*t;
    let lbl;
    if(isH) lbl=fmtHeatVal(st.def.x,av);
    else if(isV) lbl=fmtHeatVal(st.def.y,av);
    else lbl=`(${fmtHeatVal(st.def.y,yv)}, ${fmtHeatVal(st.def.x,av)})`;
    // 标注附加点出来的希腊值（Δ/Γ/V/Θ）
    const gkKeys = Object.keys(st.s.greeks||{}).filter(k=>st.s.greeks[k]);
    if(gkKeys.length){
      const vv={S:st.fixVal, DTE:st.fixVal, IV:st.fixVal};
      vv[st.def.x]=xv; vv[st.def.y]=yv;
      const gS=vv.S, gD=Math.max(vv.DTE,0), gI=Math.max(vv.IV,0.005);
      const parts = gkKeys.map(k=>{
        const g=heatGreeksRaw(st.s, gS, gD, gI, k);
        const sym = k==='delta'?'Δ':k==='gamma'?'Γ':k==='vega'?'V':'Θ';
        return sym+fmtSig(g);
      });
      lbl += '  ' + parts.join(' ');
    }
    ctx.fillStyle='#64748b';
    ctx.fillText(lbl, xp, margin.top+ph+24);
  });
  // X 轴标题：斜线写 (参数Y, 参数X, 斜率)
  let axisTitle;
  if(isH) axisTitle=`${HEAT_AXIS_LABEL[st.def.x]}（固定${HEAT_AXIS_LABEL[st.def.y]}=${fmtHeatVal(st.def.y,(L.y1+L.y2)/2)}）`;
  else if(isV) axisTitle=`${HEAT_AXIS_LABEL[st.def.y]}（固定${HEAT_AXIS_LABEL[st.def.x]}=${fmtHeatVal(st.def.x,(L.x1+L.x2)/2)}）`;
  else {
    const slope=(L.y2-L.y1)/(L.x2-L.x1);
    const sVal = st.def.y==='IV' ? (slope*100).toFixed(2)+'%' : slope.toFixed(3);
    axisTitle=`(${HEAT_AXIS_LABEL[st.def.y]}, ${HEAT_AXIS_LABEL[st.def.x]}, 斜率 ${slope>=0?'+':''}${sVal}/${axisUnit(st.def.x)||'单位'})`;
  }
  ctx.fillStyle='#1e293b'; ctx.font='bold 14px sans-serif';
  ctx.fillText(axisTitle, margin.left+pw/2, margin.top+ph+52);

  // 主标题：策略 + 固定维取值（+微笑状态说明）
  const smileNote = (st.def.x==='IV'||st.def.y==='IV'||st.def.fix==='IV')
    ? (heatSmileOn() ? ' · IV=微笑水平(ATM)，含偏度/曲率' : ' · 平IV(不含微笑)') : '';
  ctx.textAlign='left'; ctx.font='bold 15px sans-serif'; ctx.fillStyle='#1e293b';
  // 标题起点右移，避开左上角浮动的 X轴 输入条
  ctx.fillText(`${st.s.name} 截面损益（相对今天建仓成本） · 固定${HEAT_AXIS_LABEL[st.def.fix]}=${fmtHeatVal(st.def.fix,st.fixVal)}${smileNote}`, margin.left+Math.min(250,w*0.3), margin.top-30);
  ctx.font='13px sans-serif'; ctx.fillStyle='#94a3b8';
  ctx.fillText('点击=固定竖线 · 拖动竖线移动 · 右键删竖线 · 左键拖框放大 · F 复位 · 顶部"斜率"滑块=旋转剖面线 · "截面视图 ✕"返回', margin.left+Math.min(250,w*0.3), margin.top-10);

  // 曲线 + 起终点
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=3; ctx.beginPath();
  for(let i=0;i<=N;i++){ const tt=t0+(t1-t0)*i/N; i?ctx.lineTo(gx(tt),gy(vs[i])):ctx.moveTo(gx(tt),gy(vs[i])); }
  ctx.stroke();
  // 希腊值叠加（与曲线模式一致：点 Δ/Γ/V/Θ 后显示在图上）
  const gkKeys = Object.keys(st.s.greeks||{}).filter(k=>st.s.greeks[k]);
  if(gkKeys.length){
    const gkColor = {delta:'#8b5cf6', gamma:'#ec4899', vega:'#06b6d4', theta:'#f59e0b'};
    const gkLabel = {delta:'Δ', gamma:'Γ', vega:'V', theta:'Θ'};
    ctx.save();
    ctx.beginPath(); ctx.rect(margin.left,margin.top,pw,ph); ctx.clip();
    gkKeys.forEach((key, ki)=>{
      // 沿截面路径算组合希腊值，独立归一化（量级与损益不同，各自缩放）
      let gmin=Infinity, gmax=-Infinity;
      const gv = new Float64Array(N+1);
      for(let i=0;i<=N;i++){
        const tt=t0+(t1-t0)*i/N;
        const xa=L.x1+(L.x2-L.x1)*tt, ya=L.y1+(L.y2-L.y1)*tt;
        const vv={S:st.fixVal, DTE:st.fixVal, IV:st.fixVal};
        vv[st.def.x]=xa; vv[st.def.y]=ya;
        const g=heatGreeksRaw(st.s, vv.S, Math.max(vv.DTE,0), Math.max(vv.IV,0.005), key);
        gv[i]=g;
        if(g<gmin) gmin=g; if(g>gmax) gmax=g;
      }
      if(gmin===gmax){ gmin-=1; gmax+=1; }
      const gMap = g => margin.top + (gmax-g)/(gmax-gmin)*ph;
      ctx.strokeStyle=gkColor[key]; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath();
      for(let i=0;i<=N;i++){ const tt=t0+(t1-t0)*i/N; i?ctx.lineTo(gx(tt),gMap(gv[i])):ctx.moveTo(gx(tt),gMap(gv[i])); }
      ctx.stroke();
      // 图例：右上角颜色块 + 符号 + 数值范围
      ctx.fillStyle=gkColor[key]; ctx.font='bold 13px sans-serif'; ctx.textAlign='left';
      ctx.fillText(`${gkLabel[key]} ${gmin.toFixed(2)}~${gmax.toFixed(2)}`, margin.left+pw-150, margin.top+22+ki*20);
    });
    ctx.restore();
  }
  ctx.fillStyle='#2563eb';
  ctx.beginPath(); ctx.arc(gx(t0),gy(vs[0]),4,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(gx(t1),gy(vs[N]),4,0,6.283); ctx.fill();
  ctx.font='bold 13px sans-serif';
  ctx.textAlign='left';  ctx.fillText(`起 ${fmtSig(vs[0])}元`, gx(t0)+8, gy(vs[0])-8);
  ctx.textAlign='right'; ctx.fillText(`终 ${fmtSig(vs[N])}元`, gx(t1)-8, gy(vs[N])-8);

  // 固定竖线（橙色）：t + 双轴坐标 + 损益值
  slicePins.forEach(pt=>{
    if(pt<t0||pt>t1) return;
    const cxp=gx(pt);
    ctx.strokeStyle='#f97316'; ctx.lineWidth=2.5; ctx.setLineDash([8,4]);
    ctx.beginPath(); ctx.moveTo(cxp,margin.top); ctx.lineTo(cxp,margin.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    const xa=L.x1+(L.x2-L.x1)*pt, ya=L.y1+(L.y2-L.y1)*pt;
    const v=heatCellValue(st,xa,ya);
    const idx=Math.max(0,Math.min(N,Math.round((pt-t0)/(t1-t0)*N)));
    ctx.font='bold 13px sans-serif'; ctx.textAlign='left';
    let labelY=margin.top+ph-10;
    ctx.fillStyle = v>=0 ? '#dc2626' : '#16a34a';
    ctx.fillText(`${v>=0?'+':''}${fmtSig(v)}元`, cxp+6, labelY); labelY-=17;
    ctx.fillStyle='#64748b';
    ctx.fillText(`${fmtHeatVal(st.def.x,xa)} · ${fmtHeatVal(st.def.y,ya)}`, cxp+6, labelY); labelY-=17;
    // 希腊值（点 Δ/Γ/V/Θ 后显示在竖线读数里）
    const gkKeys = Object.keys(st.s.greeks||{}).filter(k=>st.s.greeks[k]);
    if(gkKeys.length){
      const vv={S:st.fixVal, DTE:st.fixVal, IV:st.fixVal};
      vv[st.def.x]=xa; vv[st.def.y]=ya;
      const gS=vv.S, gD=Math.max(vv.DTE,0), gI=Math.max(vv.IV,0.005);
      const parts = gkKeys.map(k=>{
        const g=heatGreeksRaw(st.s, gS, gD, gI, k);
        const sym = k==='delta'?'Δ':k==='gamma'?'Γ':k==='vega'?'V':'Θ';
        return sym+fmtSig(g);
      });
      ctx.fillStyle='#64748b';
      ctx.fillText(parts.join('  '), cxp+6, labelY); labelY-=17;
    }
    ctx.fillText(`t=${pt.toFixed(2)}`, cxp+6, labelY);
    // 标记点
    ctx.fillStyle='#f97316'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cxp, gy(vs[idx]), 4.5, 0, 6.283); ctx.fill(); ctx.stroke();
  });

  // hover 竖线 + 标记点
  if(sliceHoverT!=null && sliceHoverT>=t0 && sliceHoverT<=t1){
    const idx=Math.max(0,Math.min(N,Math.round((sliceHoverT-t0)/(t1-t0)*N)));
    const cxp=gx(sliceHoverT), cyp=gy(vs[idx]);
    ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(cxp,margin.top); ctx.lineTo(cxp,margin.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#f97316'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cxp,cyp,5,0,6.283); ctx.fill(); ctx.stroke();
  }
}
// 截面大图鼠标：点击=建竖线（靠近已有竖线=拖动），拖动=框选放大，hover=读数
function onSliceMouseDown(e, canvas){
  if(e.button!==0 || !sliceGeom) return;
  const {px,py}=heatEventPos(e,canvas);
  const g=sliceGeom;
  if(px<g.margin.left||px>g.margin.left+g.pw||py<g.margin.top||py>g.margin.top+g.ph) return;
  const t=g.t0 + (px-g.margin.left)/g.pw*(g.t1-g.t0);
  // 靠近已有竖线 → 拖动竖线
  if(slicePins.length){
    let best=-1,bd=Infinity;
    slicePins.forEach((pt,i)=>{ const d=Math.abs(pt-t); if(d<bd){bd=d;best=i;} });
    if(best>=0 && bd<(g.t1-g.t0)*0.02){ slicePinDrag=best; return; }
  }
  sliceDownStart={px,py,t};
}
function onSliceMouseMove(e, canvas, tooltip){
  const rect=canvas.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  if(!sliceGeom){ tooltip.style.display='none'; return; }
  const {margin,pw,ph,N,t0,t1}=sliceGeom;
  // 拖动竖线
  if(slicePinDrag>=0){
    const t=t0 + Math.max(0,Math.min(1,(px-margin.left)/pw))*(t1-t0);
    slicePins[slicePinDrag]=t;
    sliceHoverT=null; tooltip.style.display='none';
    drawChart(); return;
  }
  // 左键按下且移动 → 框选放大
  if(sliceDownStart){
    if(Math.abs(px-sliceDownStart.px)>5 || Math.abs(py-sliceDownStart.py)>5){
      if(!sliceZoomFrom) sliceZoomFrom={x:sliceDownStart.px,y:sliceDownStart.py};
      sliceZoomCur={x:px,y:py};
      tooltip.style.display='none';
      drawChart();
      // 缩放框（绿色虚线，与主图曲线模式同款）
      const ctx2=canvas.getContext('2d');
      const x=Math.min(sliceZoomFrom.x,sliceZoomCur.x), y=Math.min(sliceZoomFrom.y,sliceZoomCur.y);
      const zw=Math.abs(sliceZoomCur.x-sliceZoomFrom.x), zh=Math.abs(sliceZoomCur.y-sliceZoomFrom.y);
      ctx2.fillStyle='rgba(34,197,94,0.15)'; ctx2.fillRect(x,y,zw,zh);
      ctx2.strokeStyle='#22c55e'; ctx2.lineWidth=1.5; ctx2.setLineDash([4,3]); ctx2.strokeRect(x,y,zw,zh); ctx2.setLineDash([]);
      return;
    }
  }
  // hover 读数
  if(px<margin.left||px>margin.left+pw||py<margin.top||py>margin.top+ph){
    if(sliceHoverT!=null){ sliceHoverT=null; drawChart(); }
    tooltip.style.display='none'; return;
  }
  const t=t0 + Math.max(0,Math.min(1,(px-margin.left)/pw))*(t1-t0);
  sliceHoverT=t;
  const st=heatSetup(sliceView.hm);
  if(!st){ tooltip.style.display='none'; return; }
  const L=sliceView.L;
  const xa=L.x1+(L.x2-L.x1)*t, ya=L.y1+(L.y2-L.y1)*t;
  const v=heatCellValue(st,xa,ya);
  tooltip.style.display='block';
  tooltip.style.left=(px+12)+'px';
  tooltip.style.top=(py-46)+'px';
  tooltip.innerHTML=`t=${t.toFixed(2)} · ${HEAT_AXIS_LABEL[st.def.x]}: <strong>${fmtHeatVal(st.def.x,xa)}</strong> · ${HEAT_AXIS_LABEL[st.def.y]}: <strong>${fmtHeatVal(st.def.y,ya)}</strong><br>损益: <strong style="color:${v>=0?'#dc2626':'#16a34a'}">${v>=0?'+':''}${fmtSig(v)}元</strong>`;
  drawChart();
}
function onSliceMouseUp(e, canvas){
  if(e.button!==0) return;
  if(slicePinDrag>=0){ slicePinDrag=-1; drawChart(); return; }
  if(sliceZoomFrom){
    // 提交缩放（只沿路径方向，Y 始终自动适配）
    const g=sliceGeom;
    if(g){
      const tA=g.t0 + Math.max(0,Math.min(1,(sliceZoomFrom.x-g.margin.left)/g.pw))*(g.t1-g.t0);
      const tB=g.t0 + Math.max(0,Math.min(1,((sliceZoomCur||sliceZoomFrom).x-g.margin.left)/g.pw))*(g.t1-g.t0);
      if(Math.abs(tB-tA)>0.01) sliceZoom={t0:Math.min(tA,tB), t1:Math.max(tA,tB)};
    }
    sliceZoomFrom=null; sliceZoomCur=null; sliceDownStart=null;
    drawChart(); return;
  }
  if(sliceDownStart){
    // 原地松开 = 建竖线
    const t=sliceDownStart.t;
    sliceDownStart=null;
    if(!slicePins.some(pt=>Math.abs(pt-t)<0.005)) slicePins.push(t);
    drawChart();
  }
}
function onSliceContextMenu(e){
  // 右键删最近的竖线
  if(!sliceGeom || !slicePins.length) return;
  const rect=e.target.getBoundingClientRect();
  const px=e.clientX-rect.left;
  const g=sliceGeom;
  const t=g.t0 + Math.max(0,Math.min(1,(px-g.margin.left)/g.pw))*(g.t1-g.t0);
  let best=-1,bd=Infinity;
  slicePins.forEach((pt,i)=>{ const d=Math.abs(pt-t); if(d<bd){bd=d;best=i;} });
  if(best>=0 && bd<(g.t1-g.t0)*0.02) slicePins.splice(best,1);
}

// ========== 滑块、缩放、鼠标交互 ==========
// 策略 IV 显示统一更新（含全局偏移括号：ivOffset!=0 时显示 (±offset)）
function updateStrategyIvLabels(){
  document.querySelectorAll('.strategy-iv-val').forEach(el=>{
    const id=parseInt(el.dataset.id);
    const s=strategies.find(x=>x.id===id);
    if(s) el.innerHTML=Math.round(getStrategyIV(s)*100)+'%'+(ivOffset!==0?'<span style="color:#f59e0b">('+(ivOffset*100>=0?'+':'')+Math.round(ivOffset*100)+')</span>':'');
  });
}
function initSliders(){
  // 全局 IV 滑块默认 0（0=不干预）：用户优先用单策略 IV 滑块，需要整体调才动全局
  ivOffset = 0;
  document.getElementById('iv-slider').value=0;
  document.getElementById('iv-val').textContent='0%';
  document.getElementById('skew-slider').value=Math.round(smileParams.skew*100);
  document.getElementById('skew-val').textContent=Math.round(smileParams.skew*100);
  document.getElementById('curv-slider').value=Math.round(smileParams.curvature*100);
  document.getElementById('curv-val').textContent=Math.round(smileParams.curvature*100);
  document.getElementById('dte-slider').max=originalDTE;
  document.getElementById('dte-max').value=originalDTE;  // 范围输入框同步（滑块 max=到期天数）
  document.getElementById('dte-slider').value=sliderDTE;
  document.getElementById('dte-val').textContent=sliderDTE+'天';
  // 策略卡片上的独立 IV 显示（含全局偏移括号）
  updateStrategyIvLabels();
}
function onSliderChange(){
  // IV 水平滑块 → 全局偏移 ivOffset（0=不干预，各策略用各自的 IV）
  ivOffset = parseInt(document.getElementById('iv-slider').value)/100;
  document.getElementById('iv-val').textContent = Math.round(ivOffset*100)+'%';
  drawChart();   // 先重绘主图与右侧面板，确保 IV 滑块一定触发重绘（不被后续展示更新阻断）
  // 以下为展示性更新，单独容错：任一异常都不应影响主图/面板已完成的重绘
  try { updateStrategyIvLabels(); } catch(e) {}
  try { updateCostPreview(underlyingPrice); } catch(e) {}
  try { renderQuoteTable(); } catch(e) {}
}
function onDTESliderChange(){
  // DTE 滑块独立处理：只改 sliderDTE，不碰 smileParams.level（防止 IV=0 重置导致曲线跳）
  sliderDTE=parseInt(document.getElementById('dte-slider').value);
  document.getElementById('dte-val').textContent=sliderDTE+'天';
  updateCostPreview(underlyingPrice);
  renderQuoteTable();
  drawChart();
}
function onIVRangeChange(){
  const ivSlider=document.getElementById('iv-slider');
  const min=parseInt(document.getElementById('iv-min').value)||0, max=parseInt(document.getElementById('iv-max').value)||100;
  if(min>=max) return;
  ivSlider.min=min; ivSlider.max=max;
  const cur=parseInt(ivSlider.value);
  if(cur<min) ivSlider.value=min; if(cur>max) ivSlider.value=max;
  ivOffset=parseInt(ivSlider.value)/100;
  document.getElementById('iv-val').textContent=Math.round(ivOffset*100)+'%';
  renderQuoteTable(); drawChart();
}
function onDTERangeChange(){
  const dteSlider=document.getElementById('dte-slider');
  const min=parseInt(document.getElementById('dte-min').value)||0, max=parseInt(document.getElementById('dte-max').value)||30;
  if(min>=max) return;
  dteSlider.min=min; dteSlider.max=max;
  const cur=parseInt(dteSlider.value);
  // 只在新范围超出时钳制，范围内保留用户当前选择（不改 0-20 时滑块跳到 20）
  if(cur<min) dteSlider.value=min; else if(cur>max) dteSlider.value=max;
  sliderDTE=parseInt(dteSlider.value);
  document.getElementById('dte-val').textContent=sliderDTE+'天';
  renderQuoteTable(); drawChart();
}

function onCanvasMouseDown(e,canvas){
  if(sliceView){ onSliceMouseDown(e,canvas); return; }   // 截面大图：点击建竖线/拖动竖线/拖框放大
  if(heatMode){ onHeatMouseDown(e,canvas); return; }
  if(e.button===0 && isZPressed){
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    zoomDragStart={x:e.clientX-rect.left,y:e.clientY-rect.top};
    zoomDragCurrent={...zoomDragStart};
    isZoomDragging=true;
    return;
  }
  if(e.button===0 && !isZPressed){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const margin=chartMargin;
    const pw=rect.width-margin.left-margin.right;
    if(pw<=0) return;
    const S=chartXMin + (mx-margin.left)/pw * (chartXMax-chartXMin);
    // 若靠近已有竖线 → 拖动竖线
    if(clickedXs.length){
      let bestIdx=-1,bestDist=Infinity;
      clickedXs.forEach((cx,i)=>{ const d=Math.abs(cx-S); if(d<bestDist){bestDist=d;bestIdx=i;} });
      if(bestIdx>=0 && bestDist<(chartXMax-chartXMin)*0.02){ draggingRefIdx=bestIdx; return; }
    }
    // 否则记录按下点：原地松开=建竖线；拖动=缩放
    leftDownStart={x:mx, y:e.clientY-rect.top};
    leftDownS=S;
  }
}
function onCanvasMouseUp(e,canvas){
  if(e.button!==0) return;
  if(sliceView){ onSliceMouseUp(e,canvas); return; }
  if(heatMode){ onHeatMouseUp(e,canvas); return; }
  if(draggingRefIdx>=0){
    // 拖动结束：清除拖动标记，不新建竖线
    draggingRefIdx=-1;
    drawChart();
    return;
  }
  if(isZoomDragging){
    isZoomDragging=false;
    const dx=Math.abs((zoomDragCurrent||zoomDragStart).x-zoomDragStart.x);
    const dy=Math.abs((zoomDragCurrent||zoomDragStart).y-zoomDragStart.y);
    if(dx>5||dy>5) commitZoom(zoomDragStart,zoomDragCurrent||zoomDragStart,canvas);
    zoomDragStart=null; zoomDragCurrent=null;
    drawChart();
    return;
  }
  if(leftDownStart){
    const dx=Math.abs(e.clientX-canvas.getBoundingClientRect().left-leftDownStart.x);
    const dy=Math.abs(e.clientY-canvas.getBoundingClientRect().top-leftDownStart.y);
    const moved=dx>5||dy>5;
    leftDownStart=null;
    if(moved && zoomDragStart){
      // 拖动缩放完成（mousemove 已画框）
      commitZoom(zoomDragStart,zoomDragCurrent||zoomDragStart,canvas);
      zoomDragStart=null; zoomDragCurrent=null;
      drawChart();
      return;
    }
    if(!moved){
      // 原地松开 = 建竖线
      const rect=canvas.getBoundingClientRect();
      const mx=e.clientX-rect.left;
      const margin=chartMargin;
      const pw=rect.width-margin.left-margin.right;
      const S=chartXMin + (mx-margin.left)/pw * (chartXMax-chartXMin);
      if(mx<margin.left||mx>margin.left+pw) return;
      const tooClose=clickedXs.some(cx=>Math.abs(cx-S)<(chartXMax-chartXMin)*0.005);
      if(!tooClose) clickedXs.push(S);
      drawChart();
    }
  }
}
function onCanvasContextMenu(e,canvas){
  e.preventDefault();
  if(sliceView){ onSliceContextMenu(e); drawChart(); return; }
  if(heatMode){ heatLine=null; heatDrag=null; drawChart(); return; }
  deleteRefLine(e,canvas); drawChart();
}
function deleteRefLine(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const margin=chartMargin;
  const pw=rect.width-margin.left-margin.right;
  const mx=e.clientX-rect.left;
  const S=chartXMin + (mx-margin.left)/pw * (chartXMax-chartXMin);
  let bestIdx=-1,bestDist=Infinity;
  clickedXs.forEach((cx,i)=>{ const d=Math.abs(cx-S); if(d<bestDist){bestDist=d;bestIdx=i;} });
  if(bestIdx>=0&&bestDist<(chartXMax-chartXMin)*0.02) clickedXs.splice(bestIdx,1);
}
function commitZoom(start,end,canvas){
  const rect=canvas.getBoundingClientRect();
  const margin=chartMargin;
  const pw=rect.width-margin.left-margin.right, ph=rect.height-margin.top-margin.bottom;
  if(pw<=0||ph<=0) return;
  let xMin=chartXMin, xMax=chartXMax;
  const toX=x=>xMin+(x-margin.left)/pw*(xMax-xMin);
  const sx=Math.min(start.x,end.x), ex=Math.max(start.x,end.x);
  const sy=Math.min(start.y,end.y), ey=Math.max(start.y,end.y);
  if(Math.abs(ex-sx)<10&&Math.abs(ey-sy)<10) return;
  const newXMin=toX(sx), newXMax=toX(ex);
  // Y 方向不再传 zoomRange——让 drawChart 按对称化逻辑自动算（与未缩放时一致）
  // 否则 commitZoom 的非对称预估 Y 与 drawChart 的对称 Y 不一致 → 放大错位
  zoomStack.push({xMin,xMax});
  if(zoomStack.length>3) zoomStack.shift();
  zoomRange={xMin:newXMin,xMax:newXMax};
  customXRange=null;  // 缩放覆盖手动范围，避免 customXRange 优先级导致缩放失效
  // 同步输入框显示
  if(document.getElementById('xrange-min')) document.getElementById('xrange-min').value=newXMin.toFixed(4);
  if(document.getElementById('xrange-max')) document.getElementById('xrange-max').value=newXMax.toFixed(4);
  drawChart();
}

function onKeyDown(e){
  // F 键：一键缩回正常大小（清空所有缩放）
  if((e.key==='f'||e.key==='F') && !e.ctrlKey && !e.metaKey){
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    e.preventDefault();
    zoomStack=[];
    zoomRange=null;
    sliceZoom=null;   // 截面大图的缩放一并复位
    drawChart();
    return;
  }
  if((e.key==='z'||e.key==='Z') && e.shiftKey){
    e.preventDefault();
    if(zoomStack.length>0) zoomRange=zoomStack.pop();
    else zoomRange=null;
    customXRange=null;  // 缩放覆盖手动范围
    drawChart();
    return;
  }
  if((e.key==='z'||e.key==='Z') && !e.shiftKey && !e.ctrlKey && !e.metaKey){
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    e.preventDefault();
    isZPressed=true;
    document.getElementById('payoff-canvas').style.cursor='crosshair';
    document.getElementById('zoom-hint').style.display='block';
  }
}
function onKeyUp(e){
  if((e.key==='z'||e.key==='Z') && !e.shiftKey){
    isZPressed=false;
    document.getElementById('payoff-canvas').style.cursor='default';
    document.getElementById('zoom-hint').style.display='none';
  }
}
function onCanvasMouseMove(e,canvas,tooltip){
  if(sliceView){ onSliceMouseMove(e,canvas,tooltip); return; }
  if(heatMode){ onHeatMouseMove(e,canvas,tooltip); return; }
  if(draggingRefIdx>=0){
    // 拖动竖线：更新其 x 位置；隐藏 hover 蓝线（避免"原位置蓝线残留"的错觉）
    hoverX = null;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const margin=chartMargin;
    const pw=rect.width-margin.left-margin.right;
    if(pw>0){
      const S=chartXMin + (mx-margin.left)/pw * (chartXMax-chartXMin);
      if(!isNaN(S) && S>=chartXMin && S<=chartXMax) clickedXs[draggingRefIdx]=S;
    }
    drawChart();
    return;
  }
  if(isZoomDragging){
    const rect=canvas.getBoundingClientRect();
    zoomDragCurrent={x:e.clientX-rect.left,y:e.clientY-rect.top};
    drawChart();
    drawZoomRect(canvas);
    return;
  }
  if(leftDownStart){
    // 左键按下且移动>5px → 转为拖动缩放（原地松开仍是建竖线）
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    if(Math.abs(mx-leftDownStart.x)>5 || Math.abs(my-leftDownStart.y)>5){
      if(!zoomDragStart){
        zoomDragStart={x:leftDownStart.x,y:leftDownStart.y};
        zoomDragCurrent={x:mx,y:my};
      }else{
        zoomDragCurrent={x:mx,y:my};
      }
      drawChart();
      drawZoomRect(canvas);
      return;
    }
  }
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const margin=chartMargin;
  const pw=rect.width-margin.left-margin.right;
  const S=chartXMin + (mx-margin.left)/pw * (chartXMax-chartXMin);
  if(isNaN(S)||mx<margin.left||mx>margin.left+pw){ hoverX=null; tooltip.style.display='none'; drawChart(); return; }
  hoverX=S;
  const totalVal=calcTotalPayoff(S,sliderDTE,getStrategyIV(getActiveStrategy())||defaultIV);
  tooltip.style.display='block';
  tooltip.style.left=(mx+12)+'px';
  tooltip.style.top=(e.clientY-rect.top-40)+'px';
  tooltip.innerHTML=`标的价格: <strong>${S.toFixed(4)}</strong><br>合计价值: <strong>${totalVal.toFixed(2)}元</strong>`;
  drawChart();
}
function drawZoomRect(canvas){
  if(!zoomDragStart||!zoomDragCurrent) return;
  const ctx=canvas.getContext('2d');
  const dpr=1;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const x=Math.min(zoomDragStart.x,zoomDragCurrent.x), y=Math.min(zoomDragStart.y,zoomDragCurrent.y);
  const w=Math.abs(zoomDragCurrent.x-zoomDragStart.x), h=Math.abs(zoomDragCurrent.y-zoomDragStart.y);
  ctx.fillStyle='rgba(34,197,94,0.15)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#22c55e'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
  ctx.restore();
}

// ========== 初始化 ==========
async function init(){
  initSliderWheel(); // 滑块滚轮支持（事件委托）
  createStrategy('默认策略');
  renderTemplateChips();
  await loadUnderlyings();
  document.getElementById('underlying-select').addEventListener('change',onUnderlyingChange);
  document.getElementById('load-btn').addEventListener('click',loadQuoteData);
  document.getElementById('xrange-apply').addEventListener('click',()=>{
    const mn=parseFloat(document.getElementById('xrange-min').value), mx=parseFloat(document.getElementById('xrange-max').value);
    if(!isFinite(mn)||!isFinite(mx)||mn>=mx){ alert('范围无效：最小值必须小于最大值'); return; }
    customXRange={xMin:mn, xMax:mx};
    zoomRange=null;
    drawChart();
  });
  document.getElementById('xrange-reset').addEventListener('click',()=>{
    customXRange=null; zoomRange=null;
    if(underlyingPrice){
      document.getElementById('xrange-min').value=(underlyingPrice*0.85).toFixed(4);
      document.getElementById('xrange-max').value=(underlyingPrice*1.15).toFixed(4);
    }
    drawChart();
  });
  document.getElementById('date-input').addEventListener('change',loadQuoteData);
  document.getElementById('cost-input').addEventListener('input',onCostChange);
  document.getElementById('cost-slider').addEventListener('input',onCostSliderChange);
  document.getElementById('cost-slider').addEventListener('wheel', e=>{
    e.preventDefault();
    const sl=e.currentTarget;
    const dir=e.deltaY<0?1:-1;
    sl.value=parseFloat(sl.value)+dir*parseFloat(sl.step);
    onCostSliderChange();
  }, {passive:false});
  document.getElementById('cost-auto-btn').addEventListener('click',onCostAuto);
  document.getElementById('iv-slider').addEventListener('input',onSliderChange);
  document.getElementById('skew-slider').addEventListener('input',()=>setSmileParam('skew', parseInt(document.getElementById('skew-slider').value)/100));
  document.getElementById('curv-slider').addEventListener('input',()=>setSmileParam('curvature', parseInt(document.getElementById('curv-slider').value)/100));
  document.getElementById('dte-slider').addEventListener('input',onDTESliderChange);
  document.getElementById('iv-min').addEventListener('change',onIVRangeChange);
  document.getElementById('iv-max').addEventListener('change',onIVRangeChange);
  document.getElementById('dte-min').addEventListener('change',onDTERangeChange);
  document.getElementById('dte-max').addEventListener('change',onDTERangeChange);
  document.getElementById('new-strategy-btn').addEventListener('click',()=>createStrategy());
  document.getElementById('copy-strategy-btn').addEventListener('click',()=>copyStrategy(activeStrategyId));

  // 热力图/截面工具条状态同步（按钮高亮、固定S滑块、微笑开关、截面chip、提示语）
  function syncHeatToolbar(){
    document.querySelectorAll('.heat-btn').forEach(x=>{
      const hm = x.dataset.hm || null;
      x.classList.toggle('active', sliceView ? (hm===null) : (hm===heatMode));
    });
    const fw = document.getElementById('heat-fix-wrap');
    if(heatMode==='di' && !sliceView){
      fw.style.display='inline-flex';
      const sl = document.getElementById('heat-fix-s');
      const lo = parseFloat(document.getElementById('xrange-min').value)||underlyingPrice*0.85;
      const hi = parseFloat(document.getElementById('xrange-max').value)||underlyingPrice*1.15;
      sl.min=lo; sl.max=hi; sl.step=((hi-lo)/200).toFixed(5);
      if(!heatFixS) heatFixS=underlyingPrice;
      sl.value=heatFixS;
      document.getElementById('heat-fix-s-val').textContent=(+heatFixS).toFixed(3);
    } else fw.style.display='none';
    document.getElementById('heat-smile-wrap').style.display = (heatMode||sliceView) ? 'inline-flex' : 'none';
    document.getElementById('slice-chip').style.display = sliceView ? 'inline' : 'none';
    document.getElementById('heat-hint').style.display = (heatMode && !sliceView) ? 'inline' : 'none';
    clearSliceSlopeUI();   // 截面视图的斜率滑块（2026-09-12）
  }
  // 热力图视图切换：曲线 / S×DTE / S×IV / DTE×IV（第三维各由对应滑块联动）
  document.querySelectorAll('.heat-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      heatMode = b.dataset.hm || null;
      todayPt = null;            // 切换视图重置今天点（重新初始化到当前状态）
      sliceView = null;            // 任何视图按钮都退出截面大图
      sliceHoverT = null;
      sliceZoom = null; slicePins = []; slicePinDrag = -1;
      heatLine = null; heatDrag = null;
      syncHeatToolbar();
      drawChart();
    });
  });
  // 截面 chip：退出截面大图，回普通曲线
  document.getElementById('slice-chip').addEventListener('click',()=>{
    sliceView = null; sliceHoverT = null;
    syncHeatToolbar();
    drawChart();
  });
  // 截面视图：剖面线斜率滑块（绕中点旋转；滚轮支持走全局 initSliderWheel 委托）
  document.getElementById('slice-slope').addEventListener('input', e=>{ setSliceSlope(e.target.value); });
  document.getElementById('slice-slope').addEventListener('change', e=>{ setSliceSlope(e.target.value); });
  // 微笑开关
  document.getElementById('heat-smile').addEventListener('change', drawChart);
  // 双击热力图截面小图 → 切到截面大图（通用截面曲线视图）
  document.getElementById('payoff-canvas').addEventListener('dblclick', e=>{
    if(!heatMode || sliceView || !heatLine || !heatSliceData) return;
    const {px,py} = heatEventPos(e, document.getElementById('payoff-canvas'));
    const b = heatSliceData.box;
    if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h){
      sliceView = { L:{...heatLine}, hm:heatMode };
      sliceZoom = null; slicePins = []; slicePinDrag = -1; sliceHoverT = null;
      heatMode = null; heatLine = null; heatDrag = null;
      syncHeatToolbar();
      drawChart();
    }
  });
  document.getElementById('heat-fix-s').addEventListener('input', e=>{
    heatFixS = parseFloat(e.target.value);
    document.getElementById('heat-fix-s-val').textContent = (+e.target.value).toFixed(3);
    drawChart();
  });

  // 默认品种：取下拉里第一个（原写死 510050，行情库已无此品种 → 设了个不存在的 value → 首屏不加载行情）
  const uSel = document.getElementById('underlying-select');
  if(!uSel.value && uSel.options.length) uSel.value = uSel.options[0].value;
  // 首屏：先用页面内置骨架即刻渲染（零网络等待，慢网络下不再白屏）
  async function applyDefaultDateInput(){
    const dInp = document.getElementById('date-input');
    if(dInp.value) return;
    try {
      const r = await fetch('/api/latest-date');
      const j = await r.json();
      if(j && j.date && /^\d{8}$/.test(j.date)){
        dInp.value = j.date.slice(0,4)+'-'+j.date.slice(4,6)+'-'+j.date.slice(6,8);
        return;
      }
    } catch(e) { /* API 不可用时保留输入框原值 */ }
    const now = new Date();
    dInp.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  }
  await onUnderlyingChange();        // 用内置骨架填充下拉与行情
  await applyDefaultDateInput();
  await loadQuoteData();             // 用骨架渲染图表/报价表
  snapStatus(); updateSnapHint();
  // 异步刷新：拉到在线快照后再整体重渲染（不阻塞首屏）
  refreshSnapshot(false).then(async (ok)=>{
    if(!ok) return;
    try {
      await loadUnderlyings();       // 下拉可能随新快照换月
      snapStatus(); updateSnapHint();
      await onUnderlyingChange();
      await applyDefaultDateInput();
      await loadQuoteData();
    } catch(e) {}
  }).catch(()=>{});
  initSmileInteractions();
  snapInitUI();

  const canvas=document.getElementById('payoff-canvas');
  const tooltip=document.getElementById('chart-tooltip');
  canvas.addEventListener('mousemove',(e)=>onCanvasMouseMove(e,canvas,tooltip));
  canvas.addEventListener('mouseleave',()=>{ tooltip.style.display='none'; hoverX=null; drawChart(); });
  canvas.addEventListener('mousedown',(e)=>onCanvasMouseDown(e,canvas));
  canvas.addEventListener('mouseup',(e)=>onCanvasMouseUp(e,canvas));
  canvas.addEventListener('contextmenu',(e)=>onCanvasContextMenu(e,canvas));
  document.addEventListener('keydown',onKeyDown);
  document.addEventListener('keyup',onKeyUp);
  document.addEventListener('mouseup',(e)=>{
    if(draggingRefIdx>=0){ draggingRefIdx=-1; drawChart(); }
    // 热力图划线拖出画布松开：确认/丢弃划线，防止 heatDrag 卡死
    if(heatDrag){ heatDrag=null; drawChart(); }
    if(heatDragToday){ heatDragToday=false; }
    // 截面大图的拖动状态兜底（拖出画布松开）
    if(sliceView && (slicePinDrag>=0 || sliceDownStart || sliceZoomFrom)){
      slicePinDrag=-1; sliceDownStart=null; sliceZoomFrom=null; sliceZoomCur=null; drawChart();
    }
  });
  window.addEventListener('resize',drawChart);
  // 浏览器 Ctrl+滚轮缩放不触发 window resize，用 ResizeObserver 监听容器尺寸变化
  try {
    const ro = new ResizeObserver(()=>{ drawChart(); });
    ro.observe(document.getElementById('payoff-canvas').parentElement);
  } catch(e) { /* 老浏览器不支持时忽略 */ }
}

function renderTemplateChips(){
  const container=document.getElementById('template-chips');
  TEMPLATES.forEach(t=>{
    const chip=document.createElement('span');
    chip.className='chip'+(t.id==='custom'?' active':'');
    chip.textContent=t.name;
    chip.dataset.template=t.id;
    chip.addEventListener('click',()=>applyTemplate(t.id));
    container.appendChild(chip);
  });
}
async function loadUnderlyings(){
  const sel=document.getElementById('underlying-select');
  const prev=sel.value;
  const list=await fetchUnderlyings();
  sel.innerHTML=list.map(u=>`<option value="${u.symbol}">${u.symbol} ${u.name}</option>`).join('');
  if(prev && list.some(u=>u.symbol===prev)) sel.value=prev;   // 重建下拉后保留用户当前所选品种
}
async function onUnderlyingChange(){
  const underlying=document.getElementById('underlying-select').value;
  // 保留策略（防误操作）：只重置缩放和微笑点击线，坐标范围在 drawChart 里随新合约重算
  zoomRange = null;
  customXRange = null;  // 换品种清空手动范围，避免旧品种范围残留导致 X 轴显示异常
  smileClickX = null; smileHoverX = null;
  renderStrategyList();
  const expiries=await fetchExpiries(underlying);
  const sel=document.getElementById('expiry-select');
  sel.innerHTML=expiries.map(e=>`<option value="${e}">${e}</option>`).join('');
  const list=await fetchUnderlyings();
  const info=list.find(u=>u.symbol===underlying);
  if(info) multiplier=info.multiplier;
}
async function loadQuoteData(){
  const underlying=document.getElementById('underlying-select').value;
  const expiry=document.getElementById('expiry-select').value;
  const date=document.getElementById('date-input').value;
  if(!underlying||!expiry||!date) return;
  try{
    const result=await fetchOptions(underlying,expiry,date);
    if(result.success){
      quoteData=result.data;
      underlyingPrice=result.underlyingPrice;
      defaultIV=result.defaultIV||0.20;
      // 从 API meta 拿正确乘数（覆盖全局默认 10000）——首次加载/程序加载/下拉切换全路径生效
      if(result.multiplier) multiplier=result.multiplier;
      // 真实剩余天数：优先 API meta（行情库 days_to_expiry），API 没给才用合约月推算
      if(result.daysToExpiry){
        originalDTE = Math.max(1, Math.round(result.daysToExpiry));
      } else {
        const [y,m]=expiry.split('-').map(Number);
        const expiryDate=new Date(y,m,0);
        const nowDate=new Date(date);
        originalDTE=Math.max(1,Math.round((expiryDate-nowDate)/86400000));
      }
      sliderDTE=originalDTE;  // DTE 默认=真实剩余天数（用户可手动调）
      // 加载新行情时：重置全局增量，并给无自定义 IV 的策略同步默认 IV
      ivOffset=0;
      todayPt=null;  // 重置今天点（新标的/新到期重新初始化）
      strategies.forEach(s=>{ if(!s.ivSet) s.iv=defaultIV; });
      // 刷新策略卡片上的标的标注（切换到新合约后，默认策略的标注应跟随当前选中）
      strategies.forEach(s=>{ s.underlyingLabel = currentUnderlyingLabel(); });
      renderStrategyList();
      fitSmile();  // 用报价表 iv_theo 拟合微笑曲线三参数（smileParams.level=拟合值）
      // 全局 IV 滑块归 0（0=不干预）：用户优先用单策略 IV 滑块调，需要整体调才动全局滑块
      document.getElementById('iv-slider').value = 0;
      document.getElementById('iv-val').textContent = '0%';
      initSliders();
      document.getElementById('current-date-display').textContent=`${date}  |  标的: ${underlyingPrice?.toFixed(4)||'—'}`;
      document.getElementById('db-indicator').className='db-status';
      // 同步 X 轴范围输入框（默认 ±15%）
      if(underlyingPrice){
        document.getElementById('xrange-min').value=(underlyingPrice*0.85).toFixed(4);
        document.getElementById('xrange-max').value=(underlyingPrice*1.15).toFixed(4);
        // 默认竖线光标停在当前价（用户需求：没有竖线时补一条当前价）
        if(!clickedXs.length) clickedXs.push(underlyingPrice);
      }
      renderQuoteTable();
      drawChart();
    }
  }catch(err){
    console.error(err);
    document.getElementById('db-indicator').className='db-status disconnected';
  }
}

// 鼠标悬停在滑块上用滚轮调整值（事件委托，覆盖全局+策略卡片所有 range 滑块）
function initSliderWheel(){
  document.addEventListener('wheel', (e)=>{
    const el = e.target;
    if(!(el instanceof HTMLInputElement) || el.type !== 'range') return;
    e.preventDefault();
    const step = parseFloat(el.step) || 1;
    const dir = e.deltaY < 0 ? 1 : -1;
    const min = parseFloat(el.min), max = parseFloat(el.max);
    let v = parseFloat(el.value) + dir*step;
    if(v < min) v = min;
    if(v > max) v = max;
    el.value = v;
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  }, {passive:false});
}

init();
</script>
