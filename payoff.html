  #center-panel { width: 300px; min-width: 300px; overflow-y: auto; overflow-x: hidden; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }

  #quote-table .put-cell .price { color: var(--put-color); font-weight: 500; }

  .slider-section { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }

// ========== BS 公式 ==========
function cdfNorm(x) {
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const sign = x<0?-1:1;
  const y = Math.abs(x)/Math.sqrt(2);
  const t = 1/(1+p*y);
  const e = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-y*y);
  return 0.5*(1+sign*e);
}
function pdfNorm(x) { return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }

function bsPrice(S, K, T, r, sigma, isCall) {
  if (T <= 0) T = 0.001;
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  if (isCall) {
    const price = S*cdfNorm(d1) - K*Math.exp(-r*T)*cdfNorm(d2);
    return { price: Math.max(0.0001, price), delta: cdfNorm(d1), gamma: pdfNorm(d1)/(S*sigma*Math.sqrt(T)) };
  } else {
    const price = K*Math.exp(-r*T)*cdfNorm(-d2) - S*cdfNorm(-d1);
    return { price: Math.max(0.0001, price), delta: cdfNorm(d1)-1, gamma: pdfNorm(d1)/(S*sigma*Math.sqrt(T)) };
  }
}

// ========== 微笑曲线：对数抛物线（2026-08-10 最终版） ==========
// IV(k) = level + skew·k + curv·k²，k = ln(K/S)（对数 moneyness）
// 为什么不用 SVI：IV=√(w/T) 开根号在 ATM 处 w 小时把底部压尖（V 形），怎么调 σ 都尖；
// 抛物线在 curv>0 时底部天然圆滑（二阶导=2·curv 恒正），3 参数正好对应 3 滑块
let smileSVI = { a: 0.02, b: 0.15, rho: 0, m: 0, sigma: 0.1, T: 0.16 };  // 保留兼容（未用）

// 拟合：从报价表 iv_theo 二次拟合 level/skew/curv（k=ln(K/S)）
function fitSmile() {
  if(!quoteData.length || !underlyingPrice) return;
  const S = underlyingPrice;
  const pts = [];
  quoteData.forEach(r => {
    if(r.strike <= 0) return;
    const k = Math.log(r.strike / S);
    if(Math.abs(k) > 0.5) return;  // 只用 ±50% 内行权价
    const ivC = r.call && r.call.iv != null ? normIV(r.call.iv) : null;
    const ivP = r.put && r.put.iv != null ? normIV(r.put.iv) : null;
    if(ivC != null && isFinite(ivC) && ivC > 0.01) pts.push([k, ivC]);
    if(ivP != null && isFinite(ivP) && ivP > 0.01) pts.push([k, ivP]);
  });
  if(pts.length < 3) return;
  // 二次最小二乘：Y = [1, k, k²] · [level, skew, curv]
  let s0=0,s1=0,s2=0,s3=0,s4=0,t0=0,t1=0,t2=0;
  pts.forEach(([k,y])=>{ s0+=1; s1+=k; s2+=k*k; s3+=k*k*k; s4+=k*k*k*k; t0+=y; t1+=k*y; t2+=k*k*y; });
  const det = s0*(s2*s4-s3*s3) - s1*(s1*s4-s2*s3) + s2*(s1*s3-s2*s2);
  if(Math.abs(det) < 1e-12) return;
  const lv = (t0*(s2*s4-s3*s3) - t1*(s1*s4-s2*s3) + t2*(s1*s3-s2*s2)) / det;
  const sk = (s0*(t1*s4-t2*s3) - s1*(t0*s4-t2*s2) + s2*(t0*s3-t1*s2)) / det;
  let cu = (s0*(s2*t2-s3*t1) - s1*(s1*t2-s3*t0) + s2*(s1*t1-s2*t0)) / det;
  // 曲率默认 0（用户需求）：拟合只给 level/skew，曲率由滑块手动调
  smileParams = { level: Math.max(0.03, Math.min(1.0, lv)), skew: 0, curvature: 0 };
  smileLoaded = true;
  // 同步滑块：全局 IV 默认 0（0=不干预，各策略用自己的 IV）
  document.getElementById('iv-slider').value = 0;
  document.getElementById('iv-val').textContent = '0%';
  document.getElementById('skew-slider').value = Math.round(Math.min(100, Math.max(-100, smileParams.skew*100)));
  document.getElementById('skew-val').textContent = (smileParams.skew*100).toFixed(0);
  document.getElementById('curv-slider').value = Math.round(Math.max(0, smileParams.curvature*100));
  document.getElementById('curv-val').textContent = (smileParams.curvature*100).toFixed(0);
}

// 微笑曲线 IV（对数抛物线）
// level: ATM IV 小数，skew: 偏度（k 一次项系数），curv: 曲率（k² 系数，≥0.02 保证圆滑）
function smileIV(level, skew, curv, m) {
  // 兼容旧调用：m 是 moneyness (K/S-1)，转 k=ln(1+m)
  const k = m !== undefined ? Math.log(1 + m) : 0;
  const iv0 = level + skew*k + curv*k*k;  // curv 滑块 0~300 → 0~9.0
  // 只做下限保护（IV 不能为负——负 IV 无意义），上限不做限制（真实市场 IV 可超 95%，见过 170%）
  if(iv0 < 0.03) return 0.03 * Math.exp((iv0 - 0.03) / 0.03);  // 渐近到 0（防负值）
  return iv0;
}

// IV 归一化：快照/本地后端可能给百分制(48.57)或小数(0.4857)，统一转成小数
// snapOptionsFor 已把骨架 iv 转成小数存入 r.call.iv，故消费端不要再 /100（否则被压成 0.0048 → 真实IV点贴0轴）
function normIV(v){ return (v == null || !isFinite(v)) ? null : (v > 1 ? v/100 : v); }

// 某行权价的 IV（微笑曲线）。s 可选：传入则该策略用自己的 IV 偏移，不传用激活策略（兼容旧调用）
function getStrikeIV(S, K, s) {
  if(!S || !K) return defaultIV;
  const m = K/S - 1;
  const strat = s || getActiveStrategy();
  // 策略独立 IV：设了就用策略的绝对 IV，没设用拟合 level；全局 ivOffset 整体偏移（0=不干预）
  const base = (strat && strat.ivSet) ? strat.iv : smileParams.level;
  return smileIV(base + ivOffset, smileParams.skew, smileParams.curvature, m);
}

// 坐标刻度：5 位有效数字（模糊的正确），大数加千分位，ETF 等小数保留有效位
function fmtSig(v, sig=5){
  if(v===null||v===undefined||!isFinite(v)) return '—';
  const abs=Math.abs(v);
  if(abs===0) return '0';
  if(abs>0 && abs<0.0001) return v.toExponential(2);
  const digits = sig - 1 - Math.floor(Math.log10(abs));  // 需要的十进制小数位
  const p = Math.max(0, digits);
  const r = Number(v.toFixed(p));  if(abs>=1000) return r.toLocaleString('en-US');
  return String(r);
}

// nice 刻度：1/2/5×10^n 步长，避免零头刻度（用户需求：5/10 的整数刻度即可）
function niceTicks(min, max, target=10) {
  const range = max - min;
  if(!isFinite(range) || range <= 0) return [min, max];
  const step0 = range / target;
  const pow = Math.pow(10, Math.floor(Math.log10(step0)));
  const frac = step0 / pow;
  let step;
  if(frac <= 1) step = 1*pow;
  else if(frac <= 2) step = 2*pow;
  else if(frac <= 5) step = 5*pow;
  else step = 10*pow;
  const start = Math.floor(min / step) * step;   // 向下取整：确保刻度覆盖整个范围（含负数区间），避免负值区无刻度
  const ticks = [];
  for(let v = start; v <= max + step*1e-9; v += step) ticks.push(Number(v.toPrecision(12)));
  return ticks;
}

function strategyDTE(s){ return (s && s.atExpiry) ? 0 : sliderDTE; }
function strategyGreeksOn(s){ return s && s.greeks && (s.greeks.delta||s.greeks.gamma||s.greeks.vega||s.greeks.theta); }

function flipLeg(strategyId, legId) {
  const s = strategies.find(s=>s.id===strategyId); if(!s) return;
  const leg = s.legs.find(l=>l.id===legId);
  if(leg) { leg.direction = leg.direction==='buy'?'sell':'buy'; autoRecalcCost(s); cancelGuideMode(); refreshAll(); }
}
function removeLegFromStrategy(strategyId, legId) {
  const s = strategies.find(s=>s.id===strategyId); if(!s) return;
  s.legs = s.legs.filter(l=>l.id!==legId);
  autoRecalcCost(s);
  cancelGuideMode(); refreshAll();
}
function changeQty(strategyId, legId, delta) {
  const s = strategies.find(s=>s.id===strategyId); if(!s) return;
  const leg = s.legs.find(l=>l.id===legId);
  // qty 减到 0 不删除腿——保留占位（不参与计算），方便加回来比较
  if(leg) { leg.qty = Math.max(0, leg.qty+delta); autoRecalcCost(s); cancelGuideMode(); refreshAll(); }
}
// 直接输入手数（2026-09-12 用户要求）：±按钮保留做微调，数字框可直接改
function setLegQty(strategyId, legId, v) {
  const s = strategies.find(s=>s.id===strategyId); if(!s) return;
  const leg = s.legs.find(l=>l.id===legId); if(!leg) return;
  let q = Math.round(Number(v));
  if(!isFinite(q) || q < 0) q = 0;
  if(q > 999999) q = 999999;
  if(q === leg.qty){ refreshAll(); return; }
  leg.qty = q;
  autoRecalcCost(s); cancelGuideMode(); refreshAll();
}
function shiftStrike(strategyId, legId, dir) {
  if(!quoteData.length) return;
  const s = strategies.find(s=>s.id===strategyId); if(!s) return;
  const leg = s.legs.find(l=>l.id===legId); if(!leg) return;
  const strikes = [...new Set(quoteData.map(r=>r.strike))].sort((a,b)=>a-b);
  const idx = strikes.indexOf(leg.strike);
  if(idx===-1) return;
  const newIdx = idx + dir;
  if(newIdx<0||newIdx>=strikes.length) return;
  leg.strike = strikes[newIdx];
  autoRecalcCost(s);
  cancelGuideMode(); refreshAll();
}

function reverseActiveLegs() {
  const s = getActiveStrategy(); if(!s) return;
  s.legs.forEach(l=>l.direction=l.direction==='buy'?'sell':'buy');
  autoRecalcCost(s);
  if(guideMode && REVERSE_MAP[guideMode]) { guideMode=REVERSE_MAP[guideMode]; setActiveTemplate(guideMode); }
  else cancelGuideMode();
  refreshAll();
}
function clearActiveLegs() { const s=getActiveStrategy(); if(s){ s.legs=[]; autoRecalcCost(s); cancelGuideMode(); refreshAll(); } }

// 从当前所有腿重算建仓成本（同口径：Σ 报价表最新价×qty×乘数，买正卖负）
// 优先用报价表实际价格（用户点报价表建仓时的市场价），查不到才回退 BS 理论价
function recalcCost(s){
  if(!s) return;
  // 注：DTE=0（到期）不再强制成本归零——成本=建仓腿的理论/报价价值，与当前 DTE 无关；
  // BS 兜底路径在 T=0 时由 bsPrice 内部钳制为 0.001（取内在价值），不会产生 NaN。
  if(!underlyingPrice || !s.legs.length){ s.cost = 0; return; }
  const sdt = strategyDTE(s);
  let total = 0;
  s.legs.forEach(leg=>{
    if(!leg.qty) return; // qty=0 腿不参与
    const sign = leg.direction==='buy' ? 1 : -1;
    // 报价表价格（市场最新价）——成本=真实成交，不受"到期"勾选影响
    let quotePrice = null;
    if(quoteData && quoteData.length){
      const row = quoteData.find(r=>r.strike===leg.strike);
      const side = row ? row[leg.type] : null;
      if(side && side.lastPrice != null && isFinite(side.lastPrice)) quotePrice = side.lastPrice;
    }
    let price;
    if(quotePrice != null) price = quotePrice;
    else { const legIv=getStrikeIV(underlyingPrice, leg.strike, s); const bs = bsPrice(underlyingPrice, leg.strike, sdt/365, 0.02, legIv, leg.type==='call'); price = bs.price; } // 兜底（微笑 IV）
    total += sign * price * leg.qty * multiplier;
  });
  s.cost = total;
}
// 自动重算成本（仅在用户未手动改过成本时执行；手动改过则以手动值为准）
function autoRecalcCost(s){
  if(s && !s.costManual) recalcCost(s);
}

function addLegToActive(direction, type, strike, qty=1) {
  const s = getActiveStrategy(); if(!s) return;
  const existing = s.legs.find(l=>l.direction===direction && l.type===type && l.strike===strike);
  if(existing) existing.qty += qty;
  else {
    const opposite = s.legs.find(l=>l.direction!==direction && l.type===type && l.strike===strike);
    if(opposite) { opposite.qty -= qty; if(opposite.qty<0) opposite.qty=0; } // 对冲减到0保留腿（占位）
    else s.legs.push({id:Date.now()+Math.random(), direction, type, strike, qty, color:s.color});
  }
  autoRecalcCost(s);
  cancelGuideMode(); refreshAll();
}

function syncCostInput() {
  const s=getActiveStrategy();
  document.getElementById('cost-input').value = s?s.cost.toFixed(2):'0.00';
  updateCostSlider();
}
// 取自动成本（临时重算、不覆盖手动值）
function getAutoCost(s) {
  if(!s || !underlyingPrice || !s.legs.length) return 0;
  const old = s.cost;
  recalcCost(s);
  const auto = s.cost;
  s.cost = old;
  return auto;
}
// 成本滑块：范围 0~5×自动成本，步长=自动成本的1%（至少1元）
function updateCostSlider() {
  const slider = document.getElementById('cost-slider');
  const s = getActiveStrategy();
  if(!slider || !s) return;
  const auto = getAutoCost(s) || 1;
  const max = Math.max(auto * 5, auto + 1);
  const step = Math.max(1, auto * 0.01);
  slider.min = 0;
  slider.max = max;
  slider.step = step;
  slider.value = Math.min(Math.max(s.cost, 0), max);
}
function onCostSliderChange() {
  const s = getActiveStrategy();
  if(!s) return;
  const v = parseFloat(document.getElementById('cost-slider').value);
  if(!isFinite(v)) return;
  s.cost = v;
  s.costManual = true;
  syncCostInput();
  updateCostPreview(underlyingPrice);
  drawChart();
}
function onCostChange() { const s=getActiveStrategy(); if(s){ s.cost=parseFloat(document.getElementById('cost-input').value)||0; s.costManual=true; /* 手动改过 → 停止自动填充 */ updateCostSlider(); updateCostPreview(underlyingPrice); drawChart(); } }
function onCostAuto() {
  const s=getActiveStrategy(); if(!s) return;
  s.costManual=false; // 清除手动标记 → 恢复自动
  recalcCost(s); // 强制按当前价/IV/DTE 重算
  syncCostInput(); updateCostPreview(underlyingPrice); drawChart();
}

// ========== 渲染策略卡片（全部展开，激活高亮） ==========
function currentUnderlyingLabel(){
  // 交易所合约代码规则：CZCE=SR609（品种+年个位+月）；其他=AG2609（品种+YYMM 大写）；ETF=9月588000
  const u=document.getElementById('underlying-select');
  const e=document.getElementById('expiry-select');
  const sym=u?u.value:'';
  const expiry=(e?e.value:'').trim();
  if(!sym) return '';
  const isETF = /^\d{6}$/.test(sym);  // 6位数字 = ETF
  // 提取 YY 和 MM
  let yy=null, mm=null;
  let m = expiry.match(/^(\d{4})-(\d{2})$/);  // 2026-09
  if(m){ yy=m[1].slice(2); mm=m[2]; }
  else { m = expiry.match(/^(\d{2})-(\d{2})$/); if(m){ yy=m[1]; mm=m[2]; } }  // 26-09
  if(yy===null) return `${sym}${expiry}`;
  if(isETF) return `${parseInt(mm)}月${sym}`;   // 9月588000
  // 郑商所品种：SR609（年个位+月）；其他：AG2609（YYMM）
  const CZCE = new Set(['SR','SA','MA','TA','CF','OI','RM','FG','UR','PF','PK','CJ','AP','WH','PM','RI','LR','RS','CY','SF','SM','SH','PS','PX']);
  const uSym = sym.toUpperCase();
  if(CZCE.has(uSym)) return `${uSym}${yy.slice(-1)}${mm}`;   // SR609
  return `${uSym}${yy}${mm}`;                                 // AG2609
}

            <span style="cursor:pointer;padding:5px 11px;border-radius:6px;font-size:18px;font-weight:700;color:#fff;background:${s.greeksRel&&s.greeksRel.vega?'#06b6d4':'#334155'};" onclick="event.stopPropagation();toggleGreekRel(${s.id},'vega')" title="相对：IV每vol点变动/权利金（%/vol点）">V/</span>
            <span style="cursor:pointer;padding:5px 11px;border-radius:6px;font-size:18px;font-weight:700;color:#fff;background:${s.greeksRel&&s.greeksRel.theta?'#f59e0b':'#334155'};" onclick="event.stopPropagation();toggleGreekRel(${s.id},'theta')" title="相对：每日时间损耗/权利金（%/天）">Θ/</span>
          </div>
          <div style="font-size:14px;font-weight:700;color:#1e293b;margin:4px 0 2px;">${s.underlyingLabel||currentUnderlyingLabel()}</div>
          <table class="legs-mini-table">
            <thead><tr><th>方向</th><th>类型</th><th>行权价</th><th>手数</th><th></th></tr></thead>
            <tbody>${legsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');
}

// ========== 模板、报价、损益、图表 ==========
function setActiveTemplate(id) { activeTemplate=id; document.querySelectorAll('#template-chips .chip').forEach(c=>c.classList.toggle('active',c.dataset.template===id)); }
function cancelGuideMode() { guideMode=null; guideLeftStrike=null; guideRightStrike=null; setActiveTemplate('custom'); renderQuoteTable(); drawChart(); }
function applyTemplate(id) {
  cancelGuideMode(); setActiveTemplate(id);
  const s=getActiveStrategy(); if(!s||id==='custom') return;
  if(!underlyingPrice||!quoteData.length) return;
  const strikes=quoteData.map(r=>r.strike); const S=underlyingPrice;
  const atmStrike=strikes.reduce((prev,curr)=>Math.abs(curr-S)<Math.abs(prev-S)?curr:prev);
  const atmIdx=strikes.indexOf(atmStrike); const getStrike=(offset)=>strikes[Math.min(strikes.length-1,Math.max(0,atmIdx+offset))];
  if(TEMPLATE_MODE[id]){
    guideMode=id; guideLeftStrike=getStrike(TEMPLATE_MODE[id].left.offset); guideRightStrike=getStrike(TEMPLATE_MODE[id].right.offset);
    syncGuideLegs(); refreshAll(); return;
  }
  s.legs=[];
  switch(id){
    case 'butterfly': s.legs.push({id:Date.now(),direction:'buy',type:'call',strike:getStrike(-2),qty:1},{id:Date.now()+1,direction:'sell',type:'call',strike:atmStrike,qty:2},{id:Date.now()+2,direction:'buy',type:'call',strike:getStrike(2),qty:1}); break;
    case 'iron_condor': s.legs.push({id:Date.now(),direction:'buy',type:'put',strike:getStrike(-3)},{id:Date.now()+1,direction:'sell',type:'put',strike:getStrike(-1)},{id:Date.now()+2,direction:'sell',type:'call',strike:getStrike(1)},{id:Date.now()+3,direction:'buy',type:'call',strike:getStrike(3)}); break;
    case 'ratio_spread': s.legs.push({id:Date.now(),direction:'buy',type:'call',strike:atmStrike,qty:1},{id:Date.now()+1,direction:'sell',type:'call',strike:getStrike(3),qty:2}); break;
  }
  s.legs.forEach(l=>l.color=s.color); refreshAll();
}
function syncGuideLegs() {
  const s=getActiveStrategy(); if(!s||!guideMode) return;
  const cfg=TEMPLATE_MODE[guideMode]; s.legs=[];
  if(guideLeftStrike!==null) s.legs.push({id:Date.now(),direction:cfg.left.dir,type:cfg.left.type,strike:guideLeftStrike,qty:1});
  if(guideRightStrike!==null) s.legs.push({id:Date.now()+1,direction:cfg.right.dir,type:cfg.right.type,strike:guideRightStrike,qty:1});
  s.legs.forEach(l=>l.color=s.color);
}
function handleGuideClick(side, strike) {
  if(!guideMode) return; const cfg=TEMPLATE_MODE[guideMode];
  const isLinked=cfg.left.type!==cfg.right.type&&cfg.left.offset===cfg.right.offset;
  if(side==='left'){ guideLeftStrike=strike; if(isLinked) guideRightStrike=strike; }
  else{ guideRightStrike=strike; if(isLinked) guideLeftStrike=strike; }
  syncGuideLegs(); refreshAll();
}

  const rows=[...quoteData].sort((a,b)=>a.strike-b.strike).filter(row=>{

    const callPrice=callRaw?.lastPrice, putPrice=putRaw?.lastPrice;
    if(!gCfg){
      const activeS=getActiveStrategy();
      const hasCall=activeS?.legs.some(l=>l.strike===row.strike&&l.type==='call'), hasPut=activeS?.legs.some(l=>l.strike===row.strike&&l.type==='put');
      return `<tr${hasCall||hasPut?' class="guide-pick"':''}>
        <td class="call-cell"><span class="price">${callPrice!=null?callPrice.toFixed(4):'—'}</span></td>
        <td class="call-cell"><span class="greek">${callDelta!=null?callDelta.toFixed(2):'—'}</span></td>
        <td class="call-cell act-cell">${callPrice!=null?`<span class="act-btn act-buy" data-type="call" data-strike="${row.strike}">买</span><span class="act-btn act-sell" data-type="call" data-strike="${row.strike}">卖</span>`:''}</td>
        <td class="strike-cell">${row.strike}</td>
        <td class="put-cell act-cell">${putPrice!=null?`<span class="act-btn act-buy" data-type="put" data-strike="${row.strike}">买</span><span class="act-btn act-sell" data-type="put" data-strike="${row.strike}">卖</span>`:''}</td>
        <td class="put-cell"><span class="greek">${putDelta!=null?putDelta.toFixed(2):'—'}</span></td>
        <td class="put-cell"><span class="price">${putPrice!=null?putPrice.toFixed(4):'—'}</span></td>
      </tr>`;
    }
    const L=gCfg.left,R=gCfg.right;
    const leftData=L.type==='call'?callRaw:putRaw, rightData=R.type==='call'?callRaw:putRaw;
    const leftDelta=L.type==='call'?callDelta:putDelta, rightDelta=R.type==='call'?callDelta:putDelta;
    const leftPrice=leftData?.lastPrice, rightPrice=rightData?.lastPrice;
    let leftDisabled=!leftPrice, rightDisabled=!rightPrice;
    if(guideRightStrike!==null){

      <td class="${L.type}-cell"><span class="greek">${leftDelta!=null?leftDelta.toFixed(2):'—'}</span></td>
      <td class="${L.type}-cell act-cell">${leftPrice?`<span class="act-btn act-${L.dir} ${leftDisabled?'disabled':''} ${guideLeftStrike===row.strike?'guide-active':''}" data-side="left" data-strike="${row.strike}">${L.dir==='buy'?'买':'卖'}</span>`:''}</td>
      <td class="strike-cell">${row.strike}</td>
      <td class="${R.type}-cell act-cell">${rightPrice?`<span class="act-btn act-${R.dir} ${rightDisabled?'disabled':''} ${guideRightStrike===row.strike?'guide-active':''}" data-side="right" data-strike="${row.strike}">${R.dir==='buy'?'买':'卖'}</span>`:''}</td>
      <td class="${R.type}-cell"><span class="greek">${rightDelta!=null?rightDelta.toFixed(2):'—'}</span></td>

  if(gCfg){ tbody.querySelectorAll('.act-btn:not(.disabled)').forEach(el=>el.addEventListener('click',()=>handleGuideClick(el.dataset.side,+el.dataset.strike))); }
  else{ tbody.querySelectorAll('.act-buy').forEach(el=>el.addEventListener('click',()=>addLegToActive('buy',el.dataset.type,+el.dataset.strike))); tbody.querySelectorAll('.act-sell').forEach(el=>el.addEventListener('click',()=>addLegToActive('sell',el.dataset.type,+el.dataset.strike))); }
}

function calcPayoffForStrategy(s,S,dt,iv){ if(!s.legs.length) return 0; if(dt>0.001){ const T=dt/365,r=0.02; let total=0; for(const leg of s.legs){ if(!leg.qty) continue; const sign=leg.direction==='buy'?1:-1; const legIv=getStrikeIV(S,leg.strike,s); const bs=bsPrice(S,leg.strike,T,r,legIv,leg.type==='call'); total+=sign*bs.price*leg.qty*multiplier; } return total; }else{ let total=0; for(const leg of s.legs){ if(!leg.qty) continue; const sign=leg.direction==='buy'?1:-1; const intrinsic=leg.type==='call'?Math.max(0,S-leg.strike):Math.max(0,leg.strike-S); total+=sign*intrinsic*leg.qty*multiplier; } return total; } }
function calcTotalPayoff(S,dt,iv){ return strategies.filter(s=>s.visible).reduce((sum,s)=>sum+calcPayoffForStrategy(s,S,strategyDTE(s),getStrategyIV(s)||iv),0); }
function updateCostPreview(S){ const preview=document.getElementById('cost-preview'); const s=getActiveStrategy(); if(!S||!s||!s.legs.length){ preview.textContent=''; return; } const val=calcPayoffForStrategy(s,S,strategyDTE(s),getStrategyIV(s)); const pnl=val-s.cost; preview.innerHTML=`<strong>@${S.toFixed(4)}</strong> 价值: <strong>${val.toFixed(2)}元</strong> | 盈亏: <strong style="color:${pnl>=0?'#16a34a':'#dc2626'}">${pnl>=0?'+':''}${pnl.toFixed(2)}元</strong>`; }

function drawChart() {
  const canvas=document.getElementById('payoff-canvas');
  const wrap=canvas.parentElement;
  // 读容器（wrap）的布局尺寸：wrap 高度完全由 flex 决定，canvas 绝对定位填满它
  // canvas 位图尺寸只跟随 wrap，canvas 自身不参与布局 → 不会出现缩放累积放大
  const w=wrap.clientWidth, h=wrap.clientHeight;
  if(w<=0||h<=0) return;
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w; canvas.height=h;
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);

  const visibleStrategies=strategies.filter(s=>s.visible);
  if(!visibleStrategies.length){
    ctx.fillStyle='#94a3b8'; ctx.font='22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('请添加策略腿', w/2, h/2);
    renderLegend(); renderSmilePanel(); return;
  }

  // 截面大图模式（热力图里双击截面小图切过来）：通用截面曲线，刻度更清晰
  if(sliceView){
    gkScaleInfo={}; gkScaleInfoRel={};
    drawSliceChart(canvas, ctx, w, h);
    renderLegend(); renderSmilePanel(); return;
  }
  // 热力图模式：三维因子空间的截面（S×DTE / S×IV / DTE×IV），独立绘制管线
  if(heatMode){
    gkScaleInfo={}; gkScaleInfoRel={};   // 曲线模式的希腊值刻度在热力图模式无意义，清掉防图例残留
    drawHeatmap(canvas, ctx, w, h);
    renderLegend(); renderSmilePanel(); return;
  }

  let xMin,xMax;
  if(customXRange){ xMin=customXRange.xMin; xMax=customXRange.xMax; }
  else if(zoomRange){ xMin=zoomRange.xMin; xMax=zoomRange.xMax; }
  else{
    // X 轴范围：默认当前价 ±15%；策略腿与标的同量级时扩展到包含腿（不加额外边距）
    if(underlyingPrice){
      xMin = underlyingPrice*0.85; xMax = underlyingPrice*1.15;
      const allStrikes=visibleStrategies.flatMap(s=>s.legs.map(l=>l.strike));
      if(allStrikes.length){
        // 策略腿与当前标的同一量级（±10倍内）才参与范围——旧合约腿（量级差100倍）忽略
        const sameScale = allStrikes.filter(k=>k > underlyingPrice*0.1 && k < underlyingPrice*10);
        if(sameScale.length){ xMin=Math.min(xMin,...sameScale); xMax=Math.max(xMax,...sameScale); }
      }
    } else {
      const allStrikes=visibleStrategies.flatMap(s=>s.legs.map(l=>l.strike));
      if(!allStrikes.length){ renderLegend(); renderSmilePanel(); return; }
      xMin=Math.min(...allStrikes); xMax=Math.max(...allStrikes);
      const xR=xMax-xMin||(xMin*0.1); xMin-=xR*0.35; xMax+=xR*0.35;  // 无标的时用腿范围+边距
    }
  }

  // 防御：任何来源（手动/缩放）若给出反向范围，交换回 xMin<xMax，防止 X 轴标签乱序（数值先大后小）
  if(xMin > xMax){ const t=xMin; xMin=xMax; xMax=t; }

  chartXMin = xMin;
  chartXMax = xMax;

  const samples=400;
  const xs=Array.from({length:samples+1},(_,i)=>xMin+(xMax-xMin)*i/samples);
  const strategyCurves=visibleStrategies.map(s=>({
    strategy:s,
    combo:xs.map(x=>calcPayoffForStrategy(s,x,strategyDTE(s),getStrategyIV(s)) - (chartMode==='pnl'?s.cost:0)),
    legs:s.legs.map(leg=>xs.map(x=>{
      if(!leg.qty) return 0; // qty=0 腿不参与
      const sign=leg.direction==='buy'?1:-1;
      const sdt=strategyDTE(s);
      if(sdt>0.001){ const legIv=getStrikeIV(x,leg.strike,s); const bs=bsPrice(x,leg.strike,sdt/365,0.02,legIv,leg.type==='call'); return sign*bs.price*leg.qty*multiplier; }
      else{ const intr=leg.type==='call'?Math.max(0,x-leg.strike):Math.max(0,leg.strike-x); return sign*intr*leg.qty*multiplier; }
    }))
  }));
  const totalCombo = showTotal ? xs.map((_,i)=>strategyCurves.reduce((sum,sc)=>sum+sc.combo[i],0)) : null;

  // 各策略希腊值曲线（不同标的价格下的组合希腊值，按持仓方向和数量加总）
  const greekKeys = ['delta','gamma','vega','theta'];
  strategyCurves.forEach(sc=>{
    sc.greeks = {};
    sc.greeksRel = {}; // 相对值曲线：希腊值 ÷ 该点每张期权价格
    greekKeys.forEach(k=>{ sc.greeks[k] = xs.map(x=>{
      let sum=0;
      sc.strategy.legs.forEach(leg=>{
        if(!leg.qty) return; // qty=0 腿不参与
        const sign=leg.direction==='buy'?1:-1;
        const sdt=strategyDTE(sc.strategy);
        if(sdt<=0.001){ if(k==='delta'){ sum += sign*leg.qty*(leg.type==='call'?(x>leg.strike?1:0):(x<leg.strike?-1:0)); } return; }
        const legIv=getStrikeIV(x,leg.strike,sc.strategy); const bs=bsPrice(x,leg.strike,sdt/365,0.02,legIv,leg.type==='call');
        let v=0;
        if(k==='delta') v=bs.delta;
        else if(k==='gamma') v=bs.gamma;
        else if(k==='vega'){ const d1=(Math.log(x/leg.strike)+(0.02+legIv*legIv/2)*sdt/365)/(legIv*Math.sqrt(sdt/365)); v=x*Math.sqrt(sdt/365)*pdfNorm(d1)/100; }
        else if(k==='theta'){ const d1=(Math.log(x/leg.strike)+(0.02+legIv*legIv/2)*sdt/365)/(legIv*Math.sqrt(sdt/365)); const d2=d1-legIv*Math.sqrt(sdt/365); const t=sdt/365; v=(leg.type==='call')?(-x*pdfNorm(d1)*legIv/(2*Math.sqrt(t))-0.02*leg.strike*Math.exp(-0.02*t)*cdfNorm(d2))/365:(-x*pdfNorm(d1)*legIv/(2*Math.sqrt(t))+0.02*leg.strike*Math.exp(-0.02*t)*cdfNorm(-d2))/365; }
        sum += sign*v*leg.qty;
      });
      return sum;
    }); });
    // 相对值 = 资金效率口径（2026-08-22 与用户确认）：
    //   delta → 有效杠杆 λ=Δ·S/权利金（标的涨1%，组合价值约涨λ%）
    //   gamma → Γ·S²/(20000·权利金)（标的波动1%，gamma盈亏占权利金比例，标注×100=%/1%）
    //   vega  → ν/权利金（IV每1个vol点，组合价值变动比例，标注×100=%/vol点）
    //   theta → Θ/权利金（每天时间损耗占权利金比例，标注×100=%/天）
    // 权利金 = 该点每张期权组合理论价（不乘 multiplier、不减 cost），价值模式有意义
    greekKeys.forEach(k=>{
      sc.greeksRel[k] = xs.map((x, i)=>{
        let price=0;
        sc.strategy.legs.forEach(leg=>{
          if(!leg.qty) return; // qty=0 腿不参与
          const sign=leg.direction==='buy'?1:-1;
          const sdt=strategyDTE(sc.strategy);
          if(sdt>0.001){ const legIv=getStrikeIV(x,leg.strike,sc.strategy); const bs=bsPrice(x,leg.strike,sdt/365,0.02,legIv,leg.type==='call'); price += sign*bs.price*leg.qty; }
          else{ const intr=leg.type==='call'?Math.max(0,x-leg.strike):Math.max(0,leg.strike-x); price += sign*intr*leg.qty; }
        });
        // 价格=0 或非法时返回 Infinity（绘制时冲出屏幕顶部消失，不画 0 直线）；
        // 价格极小非0时返回真实比值（可能巨大，同样冲出屏幕表示无穷）
        // 分母取 |price|：买负卖正的符号由分子体现，分母绝对值让"卖CALL theta正 → 赚取比例"符合直觉
        if(price === 0 || !isFinite(price)) return Infinity;
        const pAbs = Math.abs(price);
        if(pAbs < 1e-9) return Infinity;
        const f = k==='delta' ? x : (k==='gamma' ? x*x/20000 : 1);
        return sc.greeks[k][i] * f / pAbs;
      });
    });
  });
  // 希腊值合计（按策略加总）
  let totalGreeks = {};
  if(showTotal && strategyCurves.length){
    greekKeys.forEach(k=>{ totalGreeks[k] = xs.map((_,i)=>strategyCurves.reduce((s,sc)=>s+sc.greeks[k][i],0)); });
  }

  // 修复Y轴范围：始终基于所有可见策略的组合值，对称化（0 固定在中线）
  // 缩放只作用于 X 轴（标的价格区间），Y 始终对称自动适配
  let yMin, yMax;
  {
    // 取所有组合值的最大绝对值 ×1.25 预留，对称范围 [-max, +max] → 0 恒在正中
    let maxAbs = 0;
    strategyCurves.forEach(sc => { sc.combo.forEach(v=>{ if(Number.isFinite(v)&&Math.abs(v)>maxAbs) maxAbs=Math.abs(v); }); });
    if(totalCombo) totalCombo.forEach(v=>{ if(Number.isFinite(v)&&Math.abs(v)>maxAbs) maxAbs=Math.abs(v); });
    const minRange = Math.max(1, underlyingPrice * multiplier * 0.02);
    if(maxAbs < minRange/2) maxAbs = minRange/2;
    maxAbs *= 1.25; // 预留上下空间
    yMin = -maxAbs; yMax = maxAbs;
  }

  const margin=chartMargin;
  const pw=w-margin.left-margin.right, ph=h-margin.top-margin.bottom;
  const toX=x=>margin.left+(x-xMin)/(xMax-xMin)*pw;
  const toY=y=>margin.top+(yMax-y)/(yMax-yMin)*ph;

  ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=0.8;
  // nice 刻度网格（1/2/5×10^n 步长，避免零头；0 恒在正中）
  const yTicks = niceTicks(yMin, yMax, 10);
  gkGridCount = Math.max(1, yTicks.length - 1);
  for(const y of yTicks){
    ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(margin.left,toY(y)); ctx.lineTo(margin.left+pw,toY(y)); ctx.stroke();
  }
  // X 轴 nice 刻度网格（细分格更浅）
  const xTicks = niceTicks(xMin, xMax, 6);
  for(const x of xTicks){ ctx.beginPath(); ctx.moveTo(toX(x),margin.top); ctx.lineTo(toX(x),margin.top+ph); ctx.stroke(); }
  if(yMin<=0&&yMax>=0){ ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(margin.left,toY(0)); ctx.lineTo(margin.left+pw,toY(0)); ctx.stroke(); }
  if(underlyingPrice){
    ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(toX(underlyingPrice),margin.top); ctx.lineTo(toX(underlyingPrice),margin.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#64748b'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText(`当前价 ${underlyingPrice.toFixed(4)}`,toX(underlyingPrice),margin.top-4);
  }

  // 填充：勾选"填"的策略，曲线与零轴之间红色(盈利)/绿色(亏损)
  ctx.save();
  ctx.beginPath(); ctx.rect(margin.left,margin.top,pw,ph); ctx.clip();
  const zeroY = toY(0);
  strategyCurves.forEach(sc=>{
    if(!sc.strategy.fill) return;
    for(let j=0;j<samples;j++){
      const y1=sc.combo[j], y2=sc.combo[j+1];
      const x1=toX(xs[j]), x2=toX(xs[j+1]);
      const sy1=toY(y1), sy2=toY(y2);
      // 两采样点都在零轴上方(盈利)
      if(y1>=0 && y2>=0){ ctx.fillStyle='rgba(239,68,68,0.18)'; ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill(); }
      // 都在下方(亏损)
      else if(y1<=0 && y2<=0){ ctx.fillStyle='rgba(34,197,94,0.18)'; ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill(); }
      // 跨零轴：求交点分段填充
      else {
        const t = y1/(y1-y2); // 交点参数 0~1
        const xi = x1 + (x2-x1)*t, yi = 0;
        if(y1>0){ // 左侧盈利段
          ctx.fillStyle='rgba(239,68,68,0.18)'; ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(xi,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill();
          ctx.fillStyle='rgba(34,197,94,0.18)'; ctx.beginPath(); ctx.moveTo(xi,zeroY); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.closePath(); ctx.fill();
        } else { // 左侧亏损段
          ctx.fillStyle='rgba(34,197,94,0.18)'; ctx.beginPath(); ctx.moveTo(x1,sy1); ctx.lineTo(xi,zeroY); ctx.lineTo(x1,zeroY); ctx.closePath(); ctx.fill();
          ctx.fillStyle='rgba(239,68,68,0.18)'; ctx.beginPath(); ctx.moveTo(xi,zeroY); ctx.lineTo(x2,sy2); ctx.lineTo(x2,zeroY); ctx.closePath(); ctx.fill();
        }
      }
    }
  });
  ctx.restore();

  strategyCurves.forEach(sc=>{
    ctx.strokeStyle=sc.strategy.color; ctx.lineWidth=2.5;
    ctx.beginPath(); let started=false;
    for(let j=0;j<=samples;j++){ const sx=toX(xs[j]), sy=toY(sc.combo[j]); if(sy<margin.top||sy>margin.top+ph){ started=false; continue; } if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy); }
    ctx.stroke();
  });
  if(showTotal && totalCombo){
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=3.5;
    ctx.beginPath(); let started=false;
    for(let j=0;j<=samples;j++){ const sx=toX(xs[j]), sy=toY(totalCombo[j]); if(sy<margin.top||sy>margin.top+ph){ started=false; continue; } if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy); }
    ctx.stroke();
  }

  // 希腊值曲线（第二 Y 轴缩放：按希腊类型着色，策略用线型/粗细区分；每个策略独立勾选）
  const anyGreekOn = strategyCurves.some(sc=>strategyGreeksOn(sc.strategy)) || strategyCurves.some(sc=>strategyGreeksRelOn(sc.strategy));
  const anyGreekAbs = {}; const anyGreekRel = {};
  greekKeys.forEach(k=>{
    anyGreekAbs[k] = strategyCurves.some(sc=>sc.strategy.greeks && sc.strategy.greeks[k]);
    anyGreekRel[k] = strategyCurves.some(sc=>sc.strategy.greeksRel && sc.strategy.greeksRel[k]);
  });
  if(anyGreekOn){
    const gkStyle = { delta:'#8b5cf6', gamma:'#ec4899', vega:'#06b6d4', theta:'#f59e0b' };
    const gkSym = { delta:'Δ', gamma:'Γ', vega:'V', theta:'Θ' };
    // 左轴 0 线位置（所有希腊值曲线共享同一 0 点，映射到这里）
    const leftZeroY = (yMin<=0 && yMax>=0) ? toY(0) : margin.top + ph/2;
    // 策略线型池：0 虚线, 1 点线, 2 长虚线, 3 点划线（同类型不同策略用不同线型）
    const dashPool = [[6,4],[2,3],[10,4],[8,3,2,3]];
    // 希腊值刻度范围：只随手数变化，完全不随 IV/DTE 变化（用户要求刻度固定）
    // 基准 IV 按希腊值分开：gamma/delta/vega 用 refIV=10%（低 IV 时它们最大，贴近品种下限）；
    // theta 用 refIV=50%（theta 与 gamma 相反——IV 越大越负，高 IV 才最大，10% 基准会让实际 IV 大时削顶）
    const refDTE = originalDTE; // 固定参考 DTE（刻度基准，不随滑块变）
    gkRefIV = { delta:0.10, gamma:0.10, vega:0.10, theta:1.00 }; // 全局，供图例标注
    // theta 用 refIV=100%：theta 与 gamma 相反——IV 越大越负，峰值在最高 IV 出现，
    // 50% 基准下用户调高 IV（60-100%）或 DTE 缩小时 theta 远超刻度削顶；100% 基准覆盖全部
    const gkRange = {};      // 绝对值刻度
    const gkRangeRel = {};   // 相对值刻度（希腊值/价格，量级完全不同）
    const niceVal = (v) => {
      if(v<=0) return 1;
      const m = Math.pow(10, Math.floor(Math.log10(v)));
      for(const n of [1,2,5,10]){ if(n*m >= v*0.85) return n*m; }
      return 10*m;
    };
    // 希腊值刻度范围：固定标尺（不随 IV/DTE 滑块移动而变）。
    // 用「所有滑块取值（DTE/IV/skew/curv 全范围）下的最高希腊值」作为上界 →
    // 滑动时只看到曲线高度/形状变化，不会被自动缩放"压窄"。标尺恒定，×1.15 余量兜底。
    // 滑块取值范围（取 slider 的 min/max，保证在任何滑块位置上曲线都不会超出标尺）
    const dteMinEl=document.getElementById('dte-min'), dteMaxEl=document.getElementById('dte-max');
    const dteLo = dteMinEl? Math.max(0, parseInt(dteMinEl.value)||0) : 0;
    const dteHi = dteMaxEl? Math.max(dteLo+1, parseInt(dteMaxEl.value)||originalDTE) : originalDTE;
    const ivLo=0.0, ivHi=1.0;      // ivOffset 被 setIVOffset 钳制在 [0,1]
    const skLo=-1.0, skHi=1.0;     // skew 滑块 -100..100 → -1..1
    const cvLo=0.0, cvHi=9.0;      // curvature 滑块 0..900 → 0..9
    // 扫描步进（希腊值光滑，粗网格即可定位峰值）；x 用步进抽样进一步降费
    const dteN=5, ivN=4, skN=2, cvN=2, xStep=3;
    function legGreek(k, x, K, T, iv, type, sign){
      if(T<=0.001) T=0.001;
      if(k==='delta'){ const bs=bsPrice(x,K,T,0.02,iv,type==='call'); return sign*bs.delta; }
      if(k==='gamma'){ const bs=bsPrice(x,K,T,0.02,iv,type==='call'); return sign*bs.gamma; }
      if(k==='vega'){ const d1=(Math.log(x/K)+(0.02+iv*iv/2)*T)/(iv*Math.sqrt(T)); return sign*x*Math.sqrt(T)*pdfNorm(d1)/100; }
      const d1=(Math.log(x/K)+(0.02+iv*iv/2)*T)/(iv*Math.sqrt(T)); const d2=d1-iv*Math.sqrt(T); const t=T;
      const th=(type==='call')?(-x*pdfNorm(d1)*iv/(2*Math.sqrt(t))-0.02*K*Math.exp(-0.02*t)*cdfNorm(d2))/365:(-x*pdfNorm(d1)*iv/(2*Math.sqrt(t))+0.02*K*Math.exp(-0.02*t)*cdfNorm(-d2))/365;
      return sign*th;
    }
    // 缓存：腿结构/开关/level/dte范围 不变时复用，避免每次拖动滑块都全量重算
    const gkCacheKey = strategyCurves.map(sc=>
      sc.strategy.legs.map(l=>l.qty+':'+l.strike+':'+l.type+':'+l.direction).join(',')+'|'+
      (sc.strategy.greeks?['d','g','v','t'].filter(x=>sc.strategy.greeks[x]).join(''):'')+'|'+
      (sc.strategy.greeksRel?['d','g','v','t'].filter(x=>sc.strategy.greeksRel[x]).join(''):'')
    ).join(';')+'#'+smileParams.level+'#'+dteLo+'#'+dteHi;
    if(gkCacheKey !== _gkCacheKey || !_gkRangeCache){
      greekKeys.forEach(k=>{
        let gMaxRef=0, gMaxRelRef=0;
        strategyCurves.forEach(sc=>{
          const absOn = sc.strategy.greeks && sc.strategy.greeks[k];
          const relOn = sc.strategy.greeksRel && sc.strategy.greeksRel[k];
          if(!absOn && !relOn) return;
          const base = (sc.strategy.ivSet)? sc.strategy.iv : smileParams.level; // 与 getStrikeIV 同一基准
          let localRef=0, localRelRef=0;
          for(let di=0; di<=dteN; di++){
            const DTE = dteLo + (dteHi-dteLo)*di/dteN;
            const T = DTE/365;
            for(let ii=0; ii<=ivN; ii++){
              const ivOff = ivLo + (ivHi-ivLo)*ii/ivN;
              for(let si=0; si<=skN; si++){
                const sk = skLo + (skHi-skLo)*si/skN;
                for(let ci=0; ci<=cvN; ci++){
                  const cv = cvLo + (cvHi-cvLo)*ci/cvN;
                  for(let i=0;i<=samples;i+=xStep){
                    const x=xs[i];
                    let combo=0, price=0;
                    sc.strategy.legs.forEach(leg=>{
                      if(!leg.qty) return; // qty=0 腿不参与
                      const sign=leg.direction==='buy'?1:-1;
                      const iv = smileIV(base + ivOff, sk, cv, leg.strike/x - 1);
                      combo += legGreek(k, x, leg.strike, T, iv, leg.type, sign);
                      // 每张期权价格（不乘 multiplier）
                      const bsp = bsPrice(x, leg.strike, T, 0.02, iv, leg.type==='call');
                      price += sign*bsp.price*leg.qty;
                    });
                    if(Math.abs(combo)>localRef) localRef=Math.abs(combo);
                    // 相对值刻度只按"价格有意义区域"算（价格<0.001 的深虚爆炸点不参与刻度）
                    if(price && Math.abs(price)>=0.001){
                      const f = k==='delta' ? x : (k==='gamma' ? x*x/20000 : 1);
                      const rel = Math.abs(combo*f/price);
                      if(rel>localRelRef) localRelRef=rel;
                    }
                  }
                }
              }
            }
          }
          if(localRef>gMaxRef) gMaxRef=localRef;
          if(localRelRef>gMaxRelRef) gMaxRelRef=localRelRef;
        });
        // nice 刻度：取最接近且 ≥ v×0.85 的 1/2/5 系列（示波器风格）
        // 对称范围 [-gNice, gNice]：0 在正中，与左轴 0 线重合；×1.15 余量防削顶且恒定不随滑块变
        if(anyGreekAbs[k]) gkRange[k] = [-niceVal(gMaxRef*1.15), niceVal(gMaxRef*1.15)];
        if(anyGreekRel[k]) gkRangeRel[k] = [-niceVal(gMaxRelRef*1.15), niceVal(gMaxRelRef*1.15)];
      });
      _gkCacheKey = gkCacheKey; _gkRangeCache = Object.assign({}, gkRange); _gkRangeRelCache = Object.assign({}, gkRangeRel);
    } else {
      Object.assign(gkRange, _gkRangeCache); Object.assign(gkRangeRel, _gkRangeRelCache);
    }
    greekKeys.forEach(k=>{
      strategyCurves.forEach((sc, si)=>{
        // 绝对值曲线（虚线）
        if(sc.strategy.greeks && sc.strategy.greeks[k] && sc.greeks[k] && gkRange[k]){
          const series = sc.greeks[k];
          const [gLo, gHi] = gkRange[k];
          const gR = (gHi-gLo) || 1;
          const gyTo = v => margin.top + (gHi - Math.max(gLo, Math.min(gHi, v))) / gR * ph;
          ctx.strokeStyle = gkStyle[k]; ctx.lineWidth = 2;
          ctx.setLineDash(dashPool[si % dashPool.length]);
          ctx.beginPath(); let started=false;
          for(let j=0;j<=samples;j++){ const sx=toX(xs[j]), sy=gyTo(series[j]); if(sy<margin.top||sy>margin.top+ph){ started=false; continue; } if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy); }
          ctx.stroke(); ctx.setLineDash([]);
        }
        // 相对值曲线（实线，粗一点区分；不 clamp——爆炸值冲出屏幕表示无穷大）
        if(sc.strategy.greeksRel && sc.strategy.greeksRel[k] && sc.greeksRel[k] && gkRangeRel[k]){
          const series = sc.greeksRel[k];
          const [gLo, gHi] = gkRangeRel[k];
          const gR = (gHi-gLo) || 1;
          const gyTo = v => margin.top + (gHi - v) / gR * ph; // 不 clamp，允许超出画布
          ctx.strokeStyle = gkStyle[k]; ctx.lineWidth = 3;
          ctx.beginPath(); let started=false;
          for(let j=0;j<=samples;j++){ const sx=toX(xs[j]), sy=gyTo(series[j]); if(sy<margin.top||sy>margin.top+ph){ started=false; continue; } if(!started){ ctx.moveTo(sx,sy); started=true; } else ctx.lineTo(sx,sy); }
          ctx.stroke();
        }
      });
    });
    // 标注：每个希腊类型一行，注明策略名+颜色点+线型（与轴刻度同字号20px）
    let ly = margin.top + 24;
    greekKeys.forEach(k=>{
      let hasAny=false; strategyCurves.forEach(sc=>{ if(sc.strategy.greeks && sc.strategy.greeks[k] && sc.greeks[k]) hasAny=true; });
      if(!hasAny) return;
      ctx.font='bold 20px sans-serif'; ctx.textAlign='left';
      ctx.fillStyle=gkStyle[k];
      ctx.fillText(gkSym[k], margin.left+4, ly);
      let lx = margin.left + 32;
      strategyCurves.forEach((sc, si)=>{
        if(!sc.strategy.greeks || !sc.strategy.greeks[k]) return;
        const series = sc.greeks[k];
        if(!series) return;
        ctx.font='20px sans-serif'; ctx.fillStyle='#1e293b';
        const midVal = series[Math.floor(samples/2)];
        // 标注精度按量级自适应：delta/gamma 2位，vega/theta 4位（否则 0.00x 显示成 0.00 误导）
        const lbl = `${sc.strategy.name.slice(0,6)}:${midVal.toFixed(k==='delta'||k==='gamma'?2:4)}`;
        // 画一个小线型示意
        ctx.save();
        ctx.setLineDash(dashPool[si % dashPool.length]); ctx.strokeStyle=sc.strategy.color; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(lx, ly-7); ctx.lineTo(lx+28, ly-7); ctx.stroke();
        ctx.restore();
        ctx.fillStyle='#1e293b';
        ctx.fillText(lbl, lx+34, ly);
        lx += 34 + ctx.measureText(lbl).width + 16;
      });
      ly += 28;
    });
    // 希腊值刻度：每格大小存 gkScaleInfo 供图例显示（Δ=0.5000 形式，一格=全范围/左轴格数）
    // 网格线统一用左轴灰色网格（不再单独画彩色网格，左右刻度线重合）
    gkScaleInfo = {};
    gkScaleInfoRel = {};
    greekKeys.forEach(k=>{
      // 绝对值刻度：一格 = 全范围 / 左轴网格格数（刻度密度与左轴一致）
      let hasAny=false; strategyCurves.forEach(sc=>{ if(sc.strategy.greeks && sc.strategy.greeks[k] && sc.greeks[k]) hasAny=true; });
      if(hasAny && gkRange[k]){
        const [gLo, gHi] = gkRange[k];
        gkScaleInfo[k] = (gHi-gLo) / gkGridCount;
      }
      // 相对值刻度
      let hasAnyRel=false; strategyCurves.forEach(sc=>{ if(sc.strategy.greeksRel && sc.strategy.greeksRel[k] && sc.greeksRel[k]) hasAnyRel=true; });
      if(hasAnyRel && gkRangeRel[k]){
        const [gLo, gHi] = gkRangeRel[k];
        gkScaleInfoRel[k] = (gHi-gLo) / gkGridCount;
      }
    });
    // 统一零点标注：希腊值 0 已映射到左轴 0 线（leftZeroY），标注同一位置
    if(Object.keys(gkScaleInfo).length){
      ctx.fillStyle='#64748b'; ctx.font='bold 20px sans-serif'; ctx.textAlign='right';
      ctx.fillText('0', margin.left + pw - 6, leftZeroY - 6);
    }
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(margin.left,margin.top,pw,ph); ctx.clip();
  const drawRefLine=(xVal,style,lineW,dash,showLabels)=>{
    const cx=toX(xVal); if(cx<margin.left||cx>margin.left+pw) return;
    ctx.strokeStyle=style; ctx.lineWidth=lineW; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(cx,margin.top); ctx.lineTo(cx,margin.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    if(!showLabels) return;
    ctx.font='bold 17px sans-serif';
    const rightSpace=margin.left+pw-cx, isRight=rightSpace>220;
    ctx.textAlign=isRight?'left':'right';
    const lx=isRight?cx+6:cx-6; let labelY=margin.top+ph-10;  // 标签从底部往上排（用户需求：文字靠下）
    // 第一行：横坐标（标的价）
    ctx.fillStyle='#64748b';
    ctx.fillText(`S=${fmtSig(xVal)}`,lx,labelY); labelY-=18;
    if(showTotal){ const totalVal=calcTotalPayoff(xVal,sliderDTE,getStrategyIV(getActiveStrategy())||defaultIV); ctx.fillStyle='#2563eb'; ctx.fillText(`合计: ${fmtSig(totalVal)}元`,lx,labelY); labelY-=18; }
    for(const s of visibleStrategies){
      const raw=calcPayoffForStrategy(s,xVal,strategyDTE(s),getStrategyIV(s));
      const val=chartMode==='pnl'?raw-s.cost:raw;
      const prefix=chartMode==='pnl'?(val>=0?'+':'')+fmtSig(val):fmtSig(val);
      ctx.fillStyle=s.color; ctx.fillText(`${s.name}: ${prefix}元`,lx,labelY); labelY-=18;
    }
    // 竖线处展示各策略勾选的希腊值：屏幕上显示哪个曲线就显示哪个值
    // 绝对值勾选 → 显示绝对值；相对值勾选 → 显示相对值；都勾 → 都显示
    const gkSymA = { delta:'Δ', gamma:'Γ', vega:'V', theta:'Θ' };
    const gkStyleA = { delta:'#8b5cf6', gamma:'#ec4899', vega:'#06b6d4', theta:'#f59e0b' };
    strategyCurves.forEach(sc=>{
      const s0=sc.strategy;
      const anyGk = strategyGreeksOn(s0) || strategyGreeksRelOn(s0);
      if(!anyGk) return;
      const idx=Math.max(0,Math.min(samples,Math.round((xVal-xMin)/(xMax-xMin)*samples)));
      const parts=[];
      greekKeys.forEach(k=>{
        // 绝对值（若勾选）
        if(s0.greeks && s0.greeks[k] && sc.greeks[k]){
          parts.push({k, v: sc.greeks[k][idx], rel:false});
        }
        // 相对值（若勾选）——资金效率口径：delta=杠杆(倍)，gamma=标的1%波动的gamma盈亏占权利金%，
        // vega=IV每vol点变动占权利金%，theta=每日时间损耗占权利金%
        if(s0.greeksRel && s0.greeksRel[k] && sc.greeksRel[k]){
          const rv = sc.greeksRel[k][idx];
          if(!isFinite(rv)){
            // 价格=0 深虚区：显示 ∞
            parts.push({k, v: rv, rel:true, inf:true});
          } else if(k==='delta'){
            parts.push({k, v: rv, rel:true, unit:'倍', dec:1});
          } else if(k==='gamma'){
            parts.push({k, v: rv*100, rel:true, unit:'%/1%', dec:2});
          } else if(k==='vega'){
            parts.push({k, v: rv*100, rel:true, unit:'%/vol', dec:2});
          } else {
            parts.push({k, v: rv*100, rel:true, unit:'%/天', dec:2});
          }
        }
      });
      if(parts.length){
        ctx.font='bold 20px sans-serif';
        parts.forEach(p=>{
          ctx.fillStyle = gkStyleA[p.k];
          if(p.inf){
            // 价格=0 深虚区：∞
            ctx.fillText(`${gkSymA[p.k]}/= ∞`, lx, labelY);
          } else if(p.rel){
            // 相对值带单位（用 = 隔开，避免 Δ/3.39 像除法）
            ctx.fillText(`${gkSymA[p.k]}/= ${p.v.toFixed(p.dec!=null?p.dec:2)}${p.unit||''}`, lx, labelY);
          } else {
            // 绝对值
            ctx.fillText(`${gkSymA[p.k]}=${p.v.toFixed(4)}`, lx, labelY);
          }
          labelY-=22;
        });
      }
    });
  };
  for(const xVal of clickedXs) drawRefLine(xVal,'#f97316',3,[8,4],true);
  if(hoverX!==null) drawRefLine(hoverX,'#3b82f6',2,[6,4],false);
  ctx.restore();

  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(margin.left,margin.top); ctx.lineTo(margin.left,margin.top+ph); ctx.lineTo(margin.left+pw,margin.top+ph); ctx.stroke();
  ctx.fillStyle='#64748b'; ctx.font='20px sans-serif'; ctx.textAlign='right';
  for(const y of yTicks){
    ctx.fillText(fmtSig(y), margin.left-4, toY(y)+3);
  }
  ctx.textAlign='center';
  for(const x of xTicks){ ctx.fillText(fmtSig(x),toX(x),margin.top+ph+25); }

  renderLegend();
  renderSmilePanel();
}

// ========== 微笑曲线大图（与损益图并排，2026-08-10） ==========
let smileClickX = null;   // 点击竖线的 x 位置（数据坐标 k）
let smileHoverX = null;   // hover 竖线
// 小窗口边距（希腊值窗口窄，边距必须小，否则 ph<=0 画不出来）
const SMILE_MARGIN = { top: 20, right: 12, bottom: 16, left: 48 };
// 动态边距：窗口越矮边距越小，保证绘图区高度（ph）至少有 40px 左右
function getMargin(cv){
  const h = cv ? cv.height : 0;
  if(h < 70)  return { top: 12, right: 10, bottom: 8,  left: 44 };
  if(h < 100) return { top: 16, right: 10, bottom: 12, left: 46 };
  if(h < 130) return { top: 18, right: 12, bottom: 14, left: 48 };
  return SMILE_MARGIN;
}

// 5 个希腊值窗口定义（IV/DELTA/GAMMA/VEGA/THETA）
const GREEK_WINDOWS = [
  { key:'iv',    label:'IV',    color:'#8b5cf6' },
  { key:'delta', label:'DELTA', color:'#10b981' },
  { key:'gamma', label:'GAMMA', color:'#f59e0b' },
  { key:'vega',  label:'VEGA',  color:'#3b82f6' },
  { key:'theta', label:'THETA', color:'#ef4444' },
];
// （2026-08-22 用户决定：小窗口"相对ATM"勾选功能已移除——概念不清晰且热力图/截面视图已覆盖其用途）
// 各希腊值的数据提取（从 quoteData 行取 call/put 值）
// 原始字段缺失时用 BS 理论值兜底（IV 取微笑曲线拟合值），保证 mock/静态数据下窗口也有曲线；
// 是否走了兜底由 hasRawGreek(key) 判断，窗口标题会标注"·理论"
function greekOf(row, side, key) {
  const o = row[side];
  if(!o) return null;
  if(key === 'iv') return (o.iv != null && isFinite(o.iv)) ? normIV(o.iv) : null;
  const v = o[key];
  if(v != null && isFinite(v)) return v;
  return theoGreek(row.strike, side==='call', key);
}
// 某希腊值是否有任一原始数据（无原始数据时整窗走的是理论兜底）
function hasRawGreek(key) {
  if(key==='iv') return quoteData.some(r=>(r.call&&r.call.iv!=null)||(r.put&&r.put.iv!=null));
  return quoteData.some(r=>(r.call&&r.call[key]!=null)||(r.put&&r.put[key]!=null));
}
// BS 理论希腊值（参数化版本：供"固定标尺扫描"复用，不依赖当前滑块全局变量）
// lvl = 绝对 IV 水平（已含 策略基准 + 全局 ivOffset），函数内部不再叠加，便于扫描/复用
function theoGreekAt(K, isCall, key, T, lvl, sk, cv, U) {
  if(!U || K<=0 || !(T>0.001)) return null;
  const iv = smileIV(lvl, sk, cv, K/U - 1);
  if(!isFinite(iv) || iv <= 0.001) return null;
  const S = U, r = 0.02;
  const d1 = (Math.log(S/K)+(r+iv*iv/2)*T)/(iv*Math.sqrt(T));
  if(key==='delta') return isCall ? cdfNorm(d1) : cdfNorm(d1)-1;
  if(key==='gamma') return pdfNorm(d1)/(S*iv*Math.sqrt(T));
  if(key==='vega')  return S*Math.sqrt(T)*pdfNorm(d1)/100;
  if(key==='theta'){
    const d2 = d1-iv*Math.sqrt(T);
    return isCall
      ? (-S*pdfNorm(d1)*iv/(2*Math.sqrt(T))-r*K*Math.exp(-r*T)*cdfNorm(d2))/365
      : (-S*pdfNorm(d1)*iv/(2*Math.sqrt(T))+r*K*Math.exp(-r*T)*cdfNorm(-d2))/365;
  }
  return null;
}
// BS 理论希腊值（右侧小图 + 数据缺失兜底）：IV = 策略基准 + 全局 ivOffset，DTE 用滑块
// base 可选：传入策略则用该策略的 IV 基准（s.ivSet ? s.iv : 拟合 level），
//   与"IV 大图(drawSmileBig)"及"期权定价(getStrikeIV)"口径一致 → 拖单策略 IV 滑块，小图同步变化；
//   不传则用拟合 level（兼容旧调用）。
function theoGreek(K, isCall, key, base) {
  if(!underlyingPrice || !originalDTE || K<=0) return null;
  const lvl = (base != null ? base : smileParams.level) + ivOffset;
  return theoGreekAt(K, isCall, key, Math.max(sliderDTE,1)/365, lvl, smileParams.skew, smileParams.curvature, underlyingPrice);
}
// 希腊值小图固定 y 轴标尺：扫描全部滑块取值（DTE/IV/skew/curv 全范围）下的理论希腊值极值，
// 作为固定上下限 → 滑动滑块时只看到曲线高度/形状变化，y 轴上限恒定不漂移（与左侧主图一致）。
// 缓存：仅当标的/基础IV/DTE 范围变化时才重算；拖动 IV/DTE/skew/curv 滑块不触发重算（标尺保持固定）。
// 注：扫描始终覆盖 skew[-1,1]、curv[0,9] 全范围，故标尺与当前 skew/curv 无关（无需进缓存键）。
let _gcScale = {};
// 希腊值小图固定 y 轴标尺
// 锚点 = 【拟合 level（市场基础 IV）】，扫描 IV 绝对水平区间与 skew/curv 全范围的理论希腊值极值，
// 作为固定上下限 → 拖动【全局 IV 滑块】或【单策略 IV 滑块】时标尺都恒定，
// 曲线在固定轴上明显上下移动（IV 变化清晰可见）。
// 区间取 [level*0.6, level+1.0]：
//   · 上界 level+1.0 → 完整覆盖全局 IV 滑块的 0~100% 满程；
//   · 下界 level*0.6 → 给"把单策略 IV 往下调"留出空间（低 IV 希腊值更大，需要上方余量，否则曲线冲出图顶）。
// 关键：标尺锚在【拟合 level】，不锚在策略 s.iv —— 否则拖策略 IV 时标尺跟着平移，曲线会被"重新居中"而看似不动。
// 为什么不再把 DTE 也纳入扫描：不同 DTE 的希腊值量级差异极大（1 天期 gamma 可达 40 天期的 ~6 倍），
// 若把 DTE 1~40 全扫进固定范围，量程会被极短期值撑到 6 倍宽，当前曲线被压成贴底一条直线、
// 拖 IV 时逐点位移只剩几像素（用户此前反馈"改 IV 小图不变"的真因）。
// 标尺仅在 DTE / 标的 / 基础 IV 变化时重算（缓存键含当前 DTE）——拖 IV/策略IV 滑块命中缓存，标尺恒定。
function greekScaleFor(key, rows, U, baseIV) {
  const T = Math.max(sliderDTE,1)/365;
  const base = (baseIV != null && isFinite(baseIV) && baseIV > 0) ? baseIV : smileParams.level;
  // 下界默认 0.6×拟合IV（给"往下调策略 IV"留余量）；若策略 IV 调得更低，下界跟着下探，防止曲线冲出图顶被裁。
  const lvlLo = Math.min(smileParams.level * 0.6, base);
  const lvlHi = smileParams.level + 1.0;
  const keyStr = key+'#'+U+'#'+smileParams.level+'#'+Math.max(sliderDTE,1)+'#'+rows.length+'#'+lvlLo.toFixed(4);
  const cached = _gcScale[key];
  if(cached && cached.keyStr === keyStr) return cached.val;
  let lo = Infinity, hi = -Infinity;
  const ivN=10, skN=3, cvN=3;
  for(let ii=0; ii<=ivN; ii++){
    const lvl = lvlLo + (lvlHi-lvlLo)*ii/ivN;
    for(let si=0; si<=skN; si++){
      const sk = -1 + 2*si/skN;
      for(let ci=0; ci<=cvN; ci++){
        const cv = 9*ci/cvN;
        for(const r of rows){
          const c = theoGreekAt(r.strike, true, key, T, lvl, sk, cv, U);
          const p = theoGreekAt(r.strike, false, key, T, lvl, sk, cv, U);
          if(c!=null){ if(c>hi) hi=c; if(c<lo) lo=c; }
          if(p!=null){ if(p>hi) hi=p; if(p<lo) lo=p; }
        }
      }
    }
  }
  if(!isFinite(lo)||!isFinite(hi)||hi<=lo){ lo=-0.001; hi=0.001; }
  const m = (hi - lo) * 0.1 || 0.001;   // 10% 余量兜底（防网格漏点导致裁切）
  const val = { lo: lo - m, hi: hi + m };
  _gcScale[key] = { keyStr, val };
  return val;
}

// 画希腊值曲线（不同行权价）：call 蓝、put 红（实线，左轴=绝对值）
function drawGreeksCurve(cv, s, key) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const m = getMargin(cv);
  const pw = W - m.left - m.right, ph = H - m.top - m.bottom;
  if(pw<=0||ph<=0) return;
  const rows = quoteData.filter(r=>r.strike>0 && isFinite(r.strike) && underlyingPrice && Math.abs(r.strike/underlyingPrice - 1) < 0.5);
  if(!rows.length) return;
  // 右侧希腊值小图恒用理论 BS 值（由当前 IV/DTE/skew/curv 滑块驱动），
  // 不取快照/模拟数据的"原始希腊值"——那些是固定 DTE/IV 下算出的冻结值，
  // 会让小图对滑块完全无响应（尤其本地预览走 fetchMockOptions 时 delta/gamma 被写死）。
  // IV 基准与 IV 大图 / 期权定价同口径：策略设了 IV 就用策略的，否则用拟合 level；
  // 再叠加全局 ivOffset（由 theoGreek 内部加）。这样拖【单策略 IV 滑块】四个希腊值小图同步变化。
  const baseIV = (s && s.ivSet) ? s.iv : smileParams.level;
  const pts = rows.map(r=>({
    x: r.strike,
    call: theoGreek(r.strike, true, key, baseIV),
    put: theoGreek(r.strike, false, key, baseIV),
  }));
  const xs = pts.map(p=>p.x);
  if(!xs.length) return;
  let xMin = Math.min(...xs), xMax = Math.max(...xs);
  const xPad = (xMax-xMin)*0.02 || 1;
  xMin -= xPad; xMax += xPad;
  // 固定 y 轴上限：覆盖全部滑块取值下的理论希腊值极值，滑动时不漂移（与左侧主图一致）
  const sc = greekScaleFor(key, rows, underlyingPrice, baseIV);
  let yMin = sc.lo, yMax = sc.hi;
  const X = x => m.left + (x-xMin)/(xMax-xMin)*pw;
  const Y = y => m.top + ph - (y-yMin)/(yMax-yMin)*ph;
  // 网格 + 轴线
  ctx.strokeStyle = 'rgba(203,213,225,0.5)'; ctx.lineWidth = 0.5;
  for(let i=0;i<=4;i++){ const yy = m.top + ph*i/4; ctx.beginPath(); ctx.moveTo(m.left,yy); ctx.lineTo(m.left+pw,yy); ctx.stroke(); }
  if(yMin<0 && yMax>0){ ctx.strokeStyle='rgba(148,163,184,0.7)'; ctx.beginPath(); ctx.moveTo(m.left,Y(0)); ctx.lineTo(m.left+pw,Y(0)); ctx.stroke(); }
  // 绝对曲线：call 蓝实线 / put 红虚线
  // （gamma/vega 的 call=put 数学相等，曲线重合；线型区分让重合时也能看出两根）
  for(const side of ['call','put']){
    const color = side==='call' ? '#3b82f6' : '#ef4444';
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    if(side==='put') ctx.setLineDash([6,4]);
    ctx.beginPath(); let started = false;
    pts.forEach(p=>{
      const v = p[side];
      if(v==null){ started = false; return; }
      const xx = X(p.x), yy = Y(v);
      if(!started){ ctx.moveTo(xx,yy); started = true; } else ctx.lineTo(xx,yy);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // 当前价竖线
  if(underlyingPrice && underlyingPrice>=xMin && underlyingPrice<=xMax){
    ctx.strokeStyle = 'rgba(148,163,184,0.7)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(X(underlyingPrice), m.top); ctx.lineTo(X(underlyingPrice), m.top+ph); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 刻度（5 位有效数字）：横轴 1/2/5 取整 6 格，避免零头
  ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  niceTicks(xMin, xMax, 6).forEach(x => ctx.fillText(fmtSig(x), X(x), m.top+ph+10));
  ctx.textAlign = 'right';
  ctx.fillText(fmtSig(yMax), m.left-3, m.top+7);
  ctx.fillText(fmtSig(yMin), m.left-3, m.top+ph);
  // 图例：蓝=Call 红=Put
  ctx.textAlign = 'left'; ctx.font = '8px sans-serif';
  ctx.fillStyle = '#3b82f6'; ctx.fillText('— Call', m.left, m.top-8);
  ctx.fillStyle = '#ef4444'; ctx.fillText('— Put', m.left+44, m.top-8);
}

function renderSmilePanel() {
  const list = document.getElementById('smile-list');
  if(!list) return;
  const sub = document.getElementById('smile-panel-sub');
  const active = getActiveStrategy();
  const s = active && active.visible ? active : strategies.find(x=>x.visible);
  if(!s || !underlyingPrice){
    list.innerHTML = '<div style="font-size:12px;color:var(--text-secondary);padding:10px;">无策略</div>';
    if(sub) sub.textContent = '';
    return;
  }
  if(sub) sub.textContent = s.name || ('策略'+s.id);
  // 单策略 5 窗口（IV/DELTA/GAMMA/VEGA/THETA）
  list.innerHTML = GREEK_WINDOWS.map(w=>{
    // 四个希腊值小图已强制用理论值（滑块驱动），恒标"·理论"；IV 大图仍用真实数据点
    const theoTag = w.key==='iv' ? (hasRawGreek('iv') ? '' : '<span style="color:#94a3b8;font-size:9px;">·理论</span>') : '<span style="color:#94a3b8;font-size:9px;">·理论</span>';
    return `<div class="smile-item" data-key="${w.key}">
    <div class="smile-item-title"><span style="color:${w.color}">${w.label}</span>${theoTag}</div>
    <canvas></canvas></div>`;
  }).join('');
  GREEK_WINDOWS.forEach(w => {
    const item = list.querySelector(`.smile-item[data-key="${w.key}"]`);
    if(!item) return;
    const cv = item.querySelector('canvas');
    const titleEl = item.querySelector('.smile-item-title');
    const titleH = titleEl ? titleEl.offsetHeight : 18;
    // 强制 reflow：确保 clientWidth/Height 已按新 DOM 布局计算（否则可能读到 0）
    void item.offsetHeight;
    const wpx = item.clientWidth, hpx = item.clientHeight - titleH;
    if(wpx<=0||hpx<=0) return;
    if(cv.width!==wpx||cv.height!==hpx){ cv.width=wpx; cv.height=hpx; }
    if(w.key === 'iv') drawSmileBig(cv, s);
    else drawGreeksCurve(cv, s, w.key);
  });
}

// 微笑大图：横轴 k=ln(K/S)，纵轴 IV(%)。画拟合曲线 + 真实数据点（报价表 iv_theo）
function drawSmileBig(cv, s) {
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const m = getMargin(cv);
  const pw = W - m.left - m.right, ph = H - m.top - m.bottom;
  if(pw<=0||ph<=0) return;
  const level = (s.ivSet ? s.iv : smileParams.level) + ivOffset;
  // 横轴范围：用实际有价格的行权价范围（quoteData 中有 lastPrice 的），留 2% 边距
  let K_MIN = underlyingPrice * 0.6, K_MAX = underlyingPrice * 1.4;
  const strikes = quoteData.filter(r=>(r.call?.lastPrice!=null&&isFinite(r.call.lastPrice))||(r.put?.lastPrice!=null&&isFinite(r.put.lastPrice)))
                           .map(r=>r.strike).filter(v=>v>0 && isFinite(v));
  if(strikes.length){
    K_MIN = Math.min(...strikes); K_MAX = Math.max(...strikes);
    const pad = (K_MAX - K_MIN) * 0.02;
    K_MIN -= pad; K_MAX += pad;
  }
  // k 范围
  const kMin = Math.log(K_MIN / underlyingPrice), kMax = Math.log(K_MAX / underlyingPrice);
  // 纵轴 IV 范围：固定标尺（不随 IV 滑块缩放）。
  // 否则整体抬升 IV 时曲线上移、纵轴也同步放大，曲线形状看似"纹丝不动"。
  // 固定上限锚在"基础量"上（与 ivOffset 无关）：max(数据点最大IV, 策略/拟合基准IV + 全局偏移上限1.0)*1.15。
  // 这样策略独立IV拉满(1.0)+全局+100%(1.0)→真实IV=2.0 也不会被削顶；拖IV时曲线在固定轴上明显移动。
  let ivMin = 0, dataMax = 0;
  const baseIV = (s && s.ivSet) ? s.iv : smileParams.level;
  quoteData.forEach(r=>{
    if(r.strike<=0) return;
    const iv = (r.call && r.call.iv != null) ? normIV(r.call.iv) : (r.put && r.put.iv != null ? normIV(r.put.iv) : null);
    if(iv != null && isFinite(iv) && iv > dataMax) dataMax = iv;
  });
  let ivMax = Math.max(dataMax, baseIV + 1.0) * 1.15;
  if(ivMax < 0.05) ivMax = 0.05;
  const kx = k => m.left + (k-kMin)/(kMax-kMin)*pw;
  const iy = iv => m.top + (ivMax-iv)/(ivMax-ivMin)*ph;

  // 网格 + 刻度（纵轴每 10% 一格；横轴每格 0.1k）
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 0.6;
  ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
  for(let iv=Math.ceil(ivMin/0.10)*0.10; iv<=ivMax+1e-9; iv+=0.10){
    const y = iy(iv);
    ctx.beginPath(); ctx.moveTo(m.left, y); ctx.lineTo(m.left+pw, y); ctx.stroke();
    ctx.fillText((iv*100).toFixed(0)+'%', m.left-4, y+4);
  }
  ctx.textAlign = 'center';
  for(let i=0;i<=10;i++){
    const k = kMin + (kMax-kMin)*i/10;
    const x = kx(k);
    const K = underlyingPrice*Math.exp(k);
    ctx.beginPath(); ctx.moveTo(x, m.top); ctx.lineTo(x, m.top+ph); ctx.stroke();
    // 刻度精度自适应：K<10 显示两位小数（ETF 1.x 元），K<100 一位，否则整数
    const kStr = K < 10 ? K.toFixed(2) : (K < 100 ? K.toFixed(1) : K.toFixed(0));
    ctx.fillText(kStr, x, m.top+ph+16);
  }
  // 轴边框
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
  ctx.strokeRect(m.left, m.top, pw, ph);

  // 真实数据点：仅画虚值点（实值 CALL=K>S 与 实值 PUT=K<S 不画），减少杂乱
  // 配色与右侧希腊值窗口统一：蓝=虚值CALL(K<S 左侧)，红=虚值PUT(K>S 右侧)
  quoteData.forEach(r=>{
    if(r.strike<=0 || !underlyingPrice) return;
    const k = Math.log(r.strike / underlyingPrice);
    if(k<kMin||k>kMax) return;
    const drawPt = (ivRaw, color) => {
      if(ivRaw==null||!isFinite(ivRaw)) return;
      const iv = normIV(ivRaw);
      if(iv<ivMin||iv>ivMax) return;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(kx(k), iy(iv), 3, 0, 6.283); ctx.fill();
    };
    if(r.strike < underlyingPrice) drawPt(r.call && r.call.iv, '#2563eb'); // 虚值 CALL
    if(r.strike > underlyingPrice) drawPt(r.put && r.put.iv, '#dc2626');  // 虚值 PUT
  });
  // 图例：蓝=虚值CALL 红=虚值PUT（仅虚值点）
  ctx.font = '9px sans-serif'; ctx.textAlign='left';
  ctx.fillStyle = '#2563eb'; ctx.fillText('● 虚值CALL', m.left+2, m.top+11);
  ctx.fillStyle = '#dc2626'; ctx.fillText('● 虚值PUT', m.left+62, m.top+11);

  // 拟合曲线（激活策略颜色，实线=绝对）
  ctx.strokeStyle = s.color; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for(let i=0;i<=80;i++){
    const k = kMin + (kMax-kMin)*i/80;
    const iv = smileIV(level, smileParams.skew, smileParams.curvature, Math.exp(k)-1);
    const X = kx(k), Y = iy(iv);
    if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
  }
  ctx.stroke();

  // ATM 线
  const atmX = kx(0);
  ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(atmX, m.top); ctx.lineTo(atmX, m.top+ph); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f97316'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ATM', atmX, m.top-8);

  // 点击竖线
  if(smileClickX!==null){
    const k = smileClickX;
    const x = kx(k);
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x, m.top); ctx.lineTo(x, m.top+ph); ctx.stroke();
    ctx.setLineDash([]);
    const iv = smileIV(level, smileParams.skew, smileParams.curvature, Math.exp(k)-1);
    const K = underlyingPrice*Math.exp(k);
    ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`K=${K.toFixed(0)}  IV=${(iv*100).toFixed(1)}%`, x+6, m.top+20);
  }
  // hover 竖线（浅蓝）
  if(smileHoverX!==null && smileHoverX!==smileClickX){
    const x = kx(smileHoverX);
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x, m.top); ctx.lineTo(x, m.top+ph); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 参数标注
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`L=${(level*100).toFixed(0)}% S=${(smileParams.skew*100).toFixed(0)} C=${(smileParams.curvature*100).toFixed(0)}`, W-6, H-6);
}

// 微笑图鼠标交互：点击画竖线，移动显示 hover
function initSmileInteractions() {
  const list = document.getElementById('smile-list');
  if(!list) return;
  const findCanvas = e => {
    const item = e.target && e.target.closest ? e.target.closest('.smile-item') : null;
    // hover/点击竖线只在 IV 窗口有意义（k 坐标换算基于 IV 窗口的 0.6~1.4 范围）
    if(item && item.dataset && item.dataset.key !== 'iv') return null;
    if(!item) return null;
    const cv = item.querySelector('canvas');
    // 只有真正点在 canvas 上才响应（点在标题栏上不算，避免误设竖线）
    return e.target === cv ? cv : null;
  };
  list.addEventListener('mousemove', e=>{
    const cv = findCanvas(e);
    if(!cv) return;
    const rect = cv.getBoundingClientRect();
    const px = e.clientX - rect.left;
    // 换算 k
    const m = getMargin(cv);
    const pw = cv.width - m.left - m.right;
    if(pw<=0) return;
    const kMin = Math.log(underlyingPrice*0.6/underlyingPrice), kMax = Math.log(underlyingPrice*1.4/underlyingPrice);
    const k = kMin + (px-m.left)/pw*(kMax-kMin);
    if(px < m.left || px > m.left+pw){ smileHoverX=null; drawSmilePanel(); return; }
    smileHoverX = k;
    drawSmilePanel();
  });
  list.addEventListener('mouseleave', ()=>{ smileHoverX=null; drawSmilePanel(); });
  list.addEventListener('click', e=>{
    const cv = findCanvas(e);
    if(!cv) return;
    const rect = cv.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const m = getMargin(cv);
    const pw = cv.width - m.left - m.right;
    if(pw<=0) return;
    const kMin = Math.log(underlyingPrice*0.6/underlyingPrice), kMax = Math.log(underlyingPrice*1.4/underlyingPrice);
    if(px < m.left || px > m.left+pw) return;
    smileClickX = kMin + (px-m.left)/pw*(kMax-kMin);
    drawSmilePanel();
  });
}
function drawSmilePanel(){
  renderSmilePanel();
}

// 图例排的希腊值刻度标注：Δ=0.5000（每格大小，希腊色，4位小数）
function gkScaleHtml(){
  const style = { delta:'#8b5cf6', gamma:'#ec4899', vega:'#06b6d4', theta:'#f59e0b' };
  const sym = { delta:'Δ', gamma:'Γ', vega:'V', theta:'Θ' };
  let html = '';
  ['delta','gamma','vega','theta'].forEach(k=>{
    const refPct = Math.round((gkRefIV[k]||0.10)*100);
    // 绝对值刻度
    if(k in gkScaleInfo){
      html += `<div class="legend-item" style="margin-left:12px;font-family:'SF Mono','Fira Code','Consolas',monospace;" title="刻度基准IV=${refPct}%（固定，不随滑块变）">
        <span style="color:${style[k]};font-weight:700;font-size:15px;">${sym[k]}=</span>
        <span style="color:${style[k]};font-size:15px;">${gkScaleInfo[k].toFixed(4)}</span>
        <span style="color:#94a3b8;font-size:12px;">(IV${refPct}%)</span>
      </div>`;
    }
    // 相对值刻度（资金效率口径，与竖线标注一致）
    if(k in gkScaleInfoRel){
      // delta=杠杆(倍，原值)；gamma/vega/theta ×100 转百分比
      const relVal = k==='delta' ? gkScaleInfoRel[k] : gkScaleInfoRel[k]*100;
      const relUnit = k==='delta' ? '倍' : (k==='gamma' ? '%/1%' : (k==='vega' ? '%/vol' : '%/天'));
      const relTip = k==='delta' ? '杠杆 λ=Δ·S/权利金' : (k==='gamma' ? '标的波动1%的gamma盈亏/权利金' : (k==='vega' ? 'IV每vol点变动/权利金' : '每日时间损耗/权利金'));
      html += `<div class="legend-item" style="margin-left:12px;font-family:'SF Mono','Fira Code','Consolas',monospace;" title="${relTip}；刻度基准IV=${refPct}%（固定）">
        <span style="color:${style[k]};font-weight:700;font-size:15px;">${sym[k]}/=</span>
        <span style="color:${style[k]};font-size:15px;">${relVal.toFixed(4)}${relUnit}</span>
        <span style="color:#94a3b8;font-size:12px;">(IV${refPct}%)</span>
